<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI NEXUS v1.8.5 - MASTER CORE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #0b1426; --accent: #0ea5e9; --bg: #f8fafc;
            --border: #e2e8f0; --text-main: #1e293b; --text-sec: #64748b;
            --color-e: #0ea5e9; --color-rev: #f59e0b; --color-ex: #10b981;
            --gold: #fbbf24; --radius: 18px; --shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR */
        .sidebar { width: 280px; background: var(--primary); padding: 30px 20px; display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; }
        .logo-box { color: white; font-weight: 800; font-size: 1.5rem; margin-bottom: 25px; display: flex; align-items: center; gap: 12px; }
        .profile-card { background: rgba(255,255,255,0.05); border-radius: var(--radius); padding: 20px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1); }
        .lvl-badge { background: var(--gold); color: var(--primary); padding: 3px 10px; border-radius: 8px; font-size: 0.7rem; font-weight: 900; text-transform: uppercase; margin-bottom: 12px; display: inline-block; }
        .xp-bar-bg { background: rgba(255,255,255,0.1); height: 10px; border-radius: 10px; overflow: hidden; }
        .xp-bar-fill { background: var(--gold); height: 100%; width: 0%; transition: 1s; }

        .nav-item { padding: 14px 18px; color: #94a3b8; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 600; border-radius: 14px; margin-bottom: 8px; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: var(--accent); color: white; }
        .submenu { margin-left: 20px; border-left: 2px solid rgba(255,255,255,0.1); display: none; flex-direction: column; }
        .submenu.show { display: flex; margin-bottom: 15px; }
        .sub-link { padding: 10px 20px; color: #64748b; font-size: 0.85rem; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .sub-link:hover { color: white; }

        /* CONTEÚDO */
        .main { flex: 1; overflow-y: auto; padding: 30px; background: var(--bg); position: relative; }
        .container { max-width: 1100px; margin: 0 auto; }
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }

        /* CARDS */
        .task-card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 15px; border: 1px solid var(--border); border-left: 12px solid #ccc; position: relative; box-shadow: var(--shadow); }
        .stat-card { background: white; padding: 25px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 20px; }
        
        .timer-box { display: flex; align-items: center; gap: 15px; background: #f8fafc; padding: 12px 20px; border-radius: 12px; margin-top: 15px; border: 1px solid var(--border); }
        .btn { padding: 12px 24px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-success { background: var(--color-ex); color: white; }
        .btn-primary { background: var(--accent); color: white; }

        #login-screen { position: fixed; inset: 0; background: var(--primary); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="login-screen">
        <div style="background:white; padding:40px; border-radius:30px; text-align:center; width:350px;">
            <h2 style="margin-bottom:20px; color: var(--primary);">OMNI MASTER</h2>
            <input type="password" id="pass-input" placeholder="Senha de Acesso" style="padding:15px; width:100%; border-radius:10px; border:1px solid #ddd; margin-bottom:20px; text-align: center;">
            <button class="btn btn-primary" style="width:100%; justify-content: center;" onclick="App.checkAccess()">ENTRAR NO SISTEMA</button>
        </div>
    </div>

    <aside class="sidebar">
        <div class="logo-box"><i class="fas fa-shield-halved"></i> OMNI v1.8.5</div>
        <div class="profile-card">
            <span class="lvl-badge" id="lvl-txt">Iniciante</span>
            <div style="color:white; font-weight:800; font-size:1.1rem;" id="xp-total">0 XP</div>
            <div class="xp-bar-bg"><div class="xp-bar-fill" id="xp-fill"></div></div>
        </div>
        <div class="nav-item active" onclick="App.showTab('diaria', this)"><i class="fas fa-rocket"></i> Dashboard</div>
        <div class="nav-item" onclick="App.showTab('semanal', this)"><i class="fas fa-calendar-week"></i> Cronograma</div>
        <div class="nav-item" onclick="App.toggleSub()"><i class="fas fa-gears"></i> Configurações <i class="fas fa-chevron-down" style="margin-left:auto;"></i></div>
        <div id="sub-plano" class="submenu">
            <div class="sub-link" onclick="App.showTab('edital')">Importar Edital</div>
            <div class="sub-link" onclick="App.showTab('sinalizar')">Sinalizar Base</div>
        </div>
    </aside>

    <main class="main">
        <div class="container">
            <div id="diaria" class="page active">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
                    <b id="active-day-display" style="font-size:1.4rem;">HOJE</b>
                    <div id="next-day-container"></div>
                </div>
                <div id="lista-diaria"></div>
            </div>

            <div id="edital" class="page">
                <div class="stat-card">
                    <h3>Importar Edital</h3>
                    <input type="text" id="add-mat" placeholder="Nome da Matéria" style="margin-top:20px; padding:15px; width:100%; border-radius:10px; border:1px solid var(--border);">
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px;">
                        <div>
                            <label style="font-size: 0.65rem; font-weight: 800; color: var(--color-e); display: block; margin-bottom: 5px; text-transform: uppercase;">Estudo (Min)</label>
                            <input type="number" id="time-e" value="60" style="padding:10px; width:100%; border-radius:8px; border:1px solid var(--border);">
                        </div>
                        <div>
                            <label style="font-size: 0.65rem; font-weight: 800; color: var(--color-rev); display: block; margin-bottom: 5px; text-transform: uppercase;">Revisão (Min)</label>
                            <input type="number" id="time-r" value="20" style="padding:10px; width:100%; border-radius:8px; border:1px solid var(--border);">
                        </div>
                        <div>
                            <label style="font-size: 0.65rem; font-weight: 800; color: var(--color-ex); display: block; margin-bottom: 5px; text-transform: uppercase;">Exercício (Min)</label>
                            <input type="number" id="time-x" value="30" style="padding:10px; width:100%; border-radius:8px; border:1px solid var(--border);">
                        </div>
                    </div>

                    <textarea id="add-ass" placeholder="Assuntos (um por linha)" style="margin-top:15px; padding:15px; height:150px; width:100%; border-radius:10px; border:1px solid var(--border);"></textarea>
                    <button class="btn btn-success" style="width:100%; margin-top:15px; justify-content: center;" onclick="App.impEdital()">SALVAR NO BANCO</button>
                </div>
            </div>

            <div id="semanal" class="page"><div class="stat-card">Funcionalidade de Cronograma em atualização...</div></div>
            <div id="sinalizar" class="page"><div id="tree"></div></div>
        </div>
    </main>

    <script>
    const App = {
        state: {
            db: JSON.parse(localStorage.getItem('omni_final_core')) || { lista: [], metaFixa: {}, xp: 0, hMaster: 4 },
            activeDay: new Date().toISOString().split('T')[0],
            today: new Date().toISOString().split('T')[0],
            timers: {}
        },

        init() { this.renderDashboard(); this.updateGamification(); },
        save() { localStorage.setItem('omni_final_core', JSON.stringify(this.state.db)); },
        
        checkAccess() { 
            const pass = document.getElementById('pass-input').value;
            if(pass === "123") { 
                document.getElementById('login-screen').style.display='none'; 
                this.init(); 
            } else {
                alert("Senha Incorreta!");
            }
        },

        showTab(id, el) { 
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(el) el.classList.add('active');
            if(id === 'sinalizar') this.renderTree();
        },

        toggleSub() { document.getElementById('sub-plano').classList.toggle('show'); },

        impEdital() { 
            const mat = document.getElementById('add-mat').value.trim(); 
            const assTextArea = document.getElementById('add-ass').value.split('\n').filter(x => x.trim()); 
            const tE = parseInt(document.getElementById('time-e').value) || 0;
            const tR = parseInt(document.getElementById('time-r').value) || 0;
            const tX = parseInt(document.getElementById('time-x').value) || 0;

            if(!mat || assTextArea.length === 0) {
                alert("Erro: Preencha a matéria e os assuntos.");
                return;
            }

            assTextArea.forEach(assunto => {
                this.state.db.lista.push({ 
                    m: mat, a: assunto.trim(), 
                    e: false, r: false, x: false, f: false,
                    metas: { estudo: tE, revisao: tR, exercicio: tX } 
                }); 
            });

            this.save(); 
            alert("Sucesso! Matéria e tempos salvos.");
            location.reload(); 
        },

        renderDashboard() {
            const container = document.getElementById('lista-diaria');
            container.innerHTML = this.state.db.lista.length === 0 ? 
                "<p style='color: #64748b;'>Nenhum edital importado. Vá em Configurações > Importar Edital.</p>" : 
                this.state.db.lista.slice(0, 5).map(t => `
                    <div class="task-card" style="border-left-color: var(--color-e)">
                        <span style="font-size:0.65rem; font-weight:800; color:var(--accent); text-transform:uppercase;">MATÉRIA: ${t.m}</span>
                        <h3 style="margin:5px 0;">${t.a}</h3>
                        <div class="timer-box">
                            <span style="font-size: 0.8rem; font-weight: bold;">Meta: ${t.metas ? t.metas.estudo : 60} min</span>
                            <input type="checkbox" style="margin-left:auto; width:22px; height:22px;">
                        </div>
                    </div>`).join('');
        },

        updateGamification() { 
            document.getElementById('xp-total').innerText = this.state.db.xp + " XP"; 
            document.getElementById('xp-fill').style.width = "10%"; 
        },

        renderTree() { 
            const container = document.getElementById('tree');
            container.innerHTML = "<h3>Base de Dados</h3>";
            this.state.db.lista.forEach(item => {
                container.innerHTML += `<div class='stat-card'>${item.m} - ${item.a}</div>`;
            });
        }
    };
    </script>
</body>
</html>
