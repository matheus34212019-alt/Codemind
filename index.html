<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI NEXUS v1.5.0 - STABLE EDITION</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #0f172a; --accent: #0ea5e9; --bg: #f8fafc;
            --border: #e2e8f0; --text-main: #1e293b; --text-sec: #64748b;
            --color-e: #0ea5e9; --color-rev: #f59e0b; --color-ex: #10b981;
            --gold: #fbbf24; --radius: 18px; --shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR PROFISSIONAL */
        .sidebar { width: 280px; background: var(--primary); padding: 30px 20px; display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; border-right: 1px solid rgba(255,255,255,0.05); }
        .logo-box { color: white; font-weight: 800; font-size: 1.4rem; margin-bottom: 25px; display: flex; align-items: center; gap: 12px; }
        
        .profile-card { background: rgba(255,255,255,0.05); border-radius: var(--radius); padding: 20px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1); }
        .lvl-badge { background: var(--gold); color: var(--primary); padding: 3px 10px; border-radius: 8px; font-size: 0.7rem; font-weight: 900; text-transform: uppercase; margin-bottom: 12px; display: inline-block; }
        .xp-bar-bg { background: rgba(255,255,255,0.1); height: 10px; border-radius: 10px; margin-top: 10px; overflow: hidden; }
        .xp-bar-fill { background: var(--gold); height: 100%; width: 0%; transition: 1s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 10px var(--gold); }

        .nav-item { padding: 14px 18px; color: #94a3b8; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 600; border-radius: 14px; margin-bottom: 8px; transition: 0.3s; font-size: 0.9rem; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.08); color: white; }
        .nav-item.active { background: var(--accent); box-shadow: 0 10px 15px rgba(14, 165, 233, 0.2); }
        
        .submenu { margin-left: 20px; border-left: 2px solid rgba(255,255,255,0.1); display: none; flex-direction: column; margin-bottom: 15px; }
        .submenu.show { display: flex; }
        .sub-link { padding: 10px 20px; color: #64748b; font-size: 0.8rem; cursor: pointer; transition: 0.2s; font-weight: 600; }
        .sub-link:hover { color: white; }

        /* MAIN AREA */
        .main { flex: 1; overflow-y: auto; padding: 30px; background: var(--bg); position: relative; scroll-behavior: smooth; }
        .container { max-width: 1100px; margin: 0 auto; }
        .page { display: none; animation: fadeIn 0.4s ease; } 
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* CARDS & DASHBOARD */
        .stat-card { background: white; padding: 22px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 20px; }
        .stat-val { font-size: 1.6rem; font-weight: 800; color: var(--primary); display: block; margin-top: 5px; }
        .stat-label { font-size: 0.7rem; font-weight: 800; color: var(--text-sec); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }

        .task-card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 20px; border: 1px solid var(--border); border-left: 12px solid #ccc; position: relative; box-shadow: var(--shadow); transition: 0.3s; }
        .task-card:hover { transform: translateY(-3px); }

        /* GRID CRONOGRAMA */
        .grid-7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; min-width: 1000px; }
        .day-column { background: white; border-radius: var(--radius); border: 1px solid var(--border); min-height: 550px; display: flex; flex-direction: column; overflow: hidden; }
        .day-head { background: #f1f5f9; padding: 15px; text-align: center; font-weight: 800; font-size: 0.75rem; border-bottom: 1px solid var(--border); color: var(--primary); }
        .day-head.today { background: var(--accent); color: white; }

        /* BOTÕES */
        .btn { padding: 14px 24px; border: none; border-radius: 14px; font-weight: 800; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 10px; justify-content: center; }
        .btn-success { background: var(--color-ex); color: white; }
        .btn-outline { background: white; border: 2px solid var(--border); color: var(--text-main); }
        
        #login-screen { position: fixed; inset: 0; background: var(--primary); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div style="background:white; padding:50px; border-radius:30px; text-align:center; width:400px; box-shadow: var(--shadow);">
            <h2 style="margin-bottom:10px; font-weight: 800;">OMNI NEXUS v1.5.0</h2>
            <p style="color: var(--text-sec); margin-bottom: 30px; font-weight: 600;">Comando Central Matheus</p>
            <input type="password" id="pass-input" placeholder="Chave de Acesso" style="text-align:center; margin-bottom: 20px; font-size: 1.2rem; padding:15px; border-radius:12px; border:1px solid var(--border); width:100%;">
            <button class="btn" style="width:100%; background:var(--accent); color:white; padding: 18px;" onclick="App.checkAccess()">INICIAR OPERAÇÃO</button>
        </div>
    </div>

    <aside class="sidebar">
        <div class="logo-box"><i class="fas fa-shield-halved" style="color:var(--accent);"></i> OMNI v1.5</div>
        <div class="profile-card">
            <span class="lvl-badge" id="lvl-txt">Iniciante</span>
            <div style="color:white; font-weight:800; font-size:1.1rem;" id="xp-total">0 XP</div>
            <div class="xp-bar-bg"><div class="xp-bar-fill" id="xp-fill"></div></div>
        </div>
        
        <div class="nav-item active" onclick="App.showTab('diaria', this)"><i class="fas fa-rocket"></i><span>Dashboard</span></div>
        <div class="nav-item" onclick="App.showTab('semanal', this)"><i class="fas fa-calendar-week"></i><span>Cronograma</span></div>
        <div class="nav-item" onclick="App.showTab('performance', this)"><i class="fas fa-chart-line"></i><span>Performance</span></div>
        
        <div class="nav-item" onclick="App.toggleSub()"><i class="fas fa-gears"></i><span>Configurações</span><i class="fas fa-chevron-down" style="margin-left:auto;"></i></div>
        <div id="sub-plano" class="submenu">
            <div class="sub-link" onclick="App.showTab('edital')">Importar Edital</div>
            <div class="sub-link" onclick="App.showTab('sinalizar')">Sinalizar Base</div>
        </div>
    </aside>

    <main class="main">
        <div class="container">
            <div id="diaria" class="page active">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
                    <div class="day-nav">
                        <b id="active-day-display" style="font-size:1.4rem;">--/--</b>
                    </div>
                </div>

                <div class="dash-grid" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:20px;">
                    <div class="stat-card"><span class="stat-label">🔥 Streak</span><span class="stat-val" id="d-streak">0</span></div>
                    <div class="stat-card"><span class="stat-label">🏆 XP Hoje</span><span class="stat-val" id="d-xp-hoje">0</span></div>
                    <div class="stat-card"><span class="stat-label">⏳ Horas</span><span class="stat-val" id="d-h-total">0h</span></div>
                    <div class="stat-card"><span class="stat-label">🎯 Acerto</span><span class="stat-val" id="d-acerto">0%</span></div>
                </div>

                <div id="lista-diaria" style="margin-top:25px;"></div>
            </div>

            <div id="semanal" class="page">
                <div style="overflow-x:auto; padding-bottom:20px;">
                    <div id="grid-semanal" class="grid-7"></div>
                </div>
            </div>

            <div id="performance" class="page">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:25px;">
                    <div class="stat-card"><canvas id="chartProgresso"></canvas></div>
                    <div class="stat-card"><canvas id="chartRendimento"></canvas></div>
                </div>
                <div id="perf-table-container" class="stat-card" style="margin-top:25px;"></div>
            </div>
            
            <div id="edital" class="page">
                <div class="stat-card">
                    <h3>Importar Edital</h3>
                    <input type="text" id="add-mat" placeholder="Nome da Matéria" style="margin-top:20px; padding:15px; border-radius:12px; border:1px solid var(--border); width:100%;">
                    <textarea id="add-ass" placeholder="Assuntos (um por linha)" style="margin-top:15px; padding:15px; border-radius:12px; border:1px solid var(--border); width:100%; height:150px;"></textarea>
                    <button class="btn btn-success" style="width:100%; margin-top:15px;" onclick="App.impEdital()">SALVAR NO BANCO</button>
                </div>
            </div>

            <div id="sinalizar" class="page"><div id="tree"></div></div>
        </div>
    </main>
    <script>
    const App = {
        state: {
            db: JSON.parse(localStorage.getItem('omni_v15_db')) || { 
                lista: [], metaFixa: {}, perf: {}, xp: 0, streak: 0, xpHistory: {} 
            },
            activeDay: new Date().toISOString().split('T')[0],
            today: new Date().toISOString().split('T')[0]
        },

        init() {
            this.renderDashboard();
            this.updateGamification();
            console.log("[SYSTEM] OMNI v1.5.0 STABLE Operacional.");
        },

        save() { localStorage.setItem('omni_v15_db', JSON.stringify(this.state.db)); },

        checkAccess() {
            if(document.getElementById('pass-input').value === "123") {
                document.getElementById('login-screen').style.display='none';
                this.init();
            }
        },

        showTab(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(el) el.classList.add('active');
            if(id === 'semanal') this.renderSemanal();
            if(id === 'performance') this.renderPerformance();
            if(id === 'sinalizar') this.renderTree();
        },

        /* MOTOR DE GERAÇÃO - LÓGICA STABLE */
        getOrCreateDailyPlan(iso) {
            if (this.state.db.metaFixa[iso]) return this.state.db.metaFixa[iso];
            let pool = [];
            const materias = [...new Set(this.state.db.lista.map(x => x.m))];
            
            materias.forEach(m => {
                const pendente = this.state.db.lista.find(x => x.m === m && !x.f);
                if (pendente) {
                    let tipo = !pendente.e ? 'E' : (!pendente.r ? 'Rev' : 'Ex');
                    pool.push({ id: Math.random().toString(36).substr(2, 9), m: m, a: pendente.a, k: tipo, c: false, d: iso });
                }
            });
            this.state.db.metaFixa[iso] = pool;
            this.save();
            return pool;
        },

        renderDashboard() {
            const tasks = this.getOrCreateDailyPlan(this.state.activeDay);
            const container = document.getElementById('lista-diaria');
            document.getElementById('active-day-display').innerText = this.state.activeDay.split('-').reverse().slice(0,2).join('/');
            
            container.innerHTML = tasks.map(t => `
                <div class="task-card" style="border-left-color: ${t.k==='Ex'?'#10b981':(t.k==='Rev'?'#f59e0b':'#0ea5e9')}; opacity: ${t.c?0.5:1}">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <span style="font-size:0.6rem; font-weight:800; color:var(--accent)">${t.k.toUpperCase()}</span>
                            <h3 style="margin:5px 0;">${t.m}</h3>
                            <p style="font-weight:600; color:var(--text-sec); font-size:0.85rem;">${t.a}</p>
                        </div>
                        <input type="checkbox" ${t.c?'checked':''} onclick="App.toggleTask('${t.id}')" style="width:25px; height:25px;">
                    </div>
                </div>
            `).join('');
        },

        toggleTask(id) {
            const t = this.state.db.metaFixa[this.state.activeDay].find(x => x.id == id);
            t.c = !t.c;
            if(t.c) {
                const item = this.state.db.lista.find(x => x.m === t.m && x.a === t.a);
                if(t.k === 'E') item.e = true;
                if(t.k === 'Rev') item.r = true;
                if(t.k === 'Ex') { item.x = true; item.f = true; }
                this.state.db.xp += 50;
            }
            this.save(); this.renderDashboard(); this.updateGamification();
        },

        renderSemanal() {
            const grid = document.getElementById('grid-semanal'); grid.innerHTML = "";
            for(let i=0; i<7; i++) {
                let d = new Date(this.state.today + "T12:00:00");
                d.setDate(d.getDate() + i);
                let iso = d.toISOString().split('T')[0];
                let tasks = this.getOrCreateDailyPlan(iso);
                grid.innerHTML += `<div class="day-column">
                    <div class="day-head ${iso===this.state.today?'today':''}">${iso.split('-').reverse().slice(0,2).join('/')}</div>
                    <div style="padding:10px;">${tasks.map(x=>`<div style="font-size:0.65rem; font-weight:800; margin-bottom:5px; padding:5px; background:#f8fafc; border-radius:5px;">${x.m}</div>`).join('')}</div>
                </div>`;
            }
        },

        updateGamification() {
            document.getElementById('xp-total').innerText = this.state.db.xp + " XP";
            document.getElementById('xp-fill').style.width = Math.min((this.state.db.xp/5000)*100, 100) + "%";
        },

        impEdital() {
            const m = document.getElementById('add-mat').value;
            const ass = document.getElementById('add-ass').value.split('\n').filter(x=>x.trim());
            ass.forEach(a => { this.state.db.lista.push({ m, a: a.trim(), e:false, r:false, x:false, f:false }); });
            this.save(); alert("Importado!"); location.reload();
        },

        toggleSub() { document.getElementById('sub-plano').classList.toggle('show'); }
    };
    </script>
</body>
</html>
