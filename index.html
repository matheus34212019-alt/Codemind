<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI NEXUS v.114 - THE ARCHITECT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #0f172a; --accent: #3b82f6; --bg: #f8fafc;
            --card-bg: #ffffff; --border: #e2e8f0; --text-main: #1e293b; --text-sec: #64748b;
            --color-e: linear-gradient(135deg, #3b82f6, #2563eb); 
            --color-rev: linear-gradient(135deg, #f59e0b, #d97706); 
            --color-ex: linear-gradient(135deg, #10b981, #059669);
            --radius-md: 20px; --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR */
        .sidebar { width: 280px; background: var(--primary); display: flex; flex-direction: column; padding: 30px 20px; border-right: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; overflow-y: auto; }
        .logo-box { padding-bottom: 40px; color: white; display: flex; align-items: center; gap: 15px; font-weight: 800; font-size: 1.4rem; letter-spacing: -1px; }
        .nav-item { padding: 14px 18px; color: #94a3b8; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 600; border-radius: 16px; transition: 0.3s; margin-bottom: 8px; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.06); color: white; }
        .nav-item.active { background: var(--accent); box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4); }
        .submenu { margin-left: 15px; border-left: 1px solid rgba(255,255,255,0.1); display: none; flex-direction: column; padding: 5px 0; }
        .submenu.show { display: flex; }
        .sub-link { padding: 10px 10px 10px 25px; color: #64748b; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
        .sub-link:hover { color: white; }

        /* MAIN */
        .main { flex: 1; overflow-y: auto; padding: 40px; scroll-behavior: smooth; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 35px; }
        .stat-card { background: white; padding: 22px; border-radius: var(--radius-md); border: 1px solid var(--border); box-shadow: var(--shadow); position: relative; }
        .stat-card small { text-transform: uppercase; font-weight: 800; font-size: 0.65rem; color: var(--text-sec); letter-spacing: 1px; }
        .stat-val { font-size: 1.5rem; font-weight: 800; margin-top: 8px; color: var(--primary); }

        .task-card { background: white; border-radius: 18px; padding: 22px; margin-bottom: 15px; border: 1px solid var(--border); border-left: 10px solid #ccc; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .tag { font-size: 0.65rem; font-weight: 800; padding: 6px 14px; border-radius: 50px; color: white; margin-bottom: 8px; display: inline-block; }
        .tag-e { background: var(--color-e); } .tag-rev { background: var(--color-rev); } .tag-ex { background: var(--color-ex); }

        .grid-7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; min-width: 1100px; }
        .day-column { background: white; border: 1px solid var(--border); border-radius: 18px; min-height: 600px; display: flex; flex-direction: column; overflow: hidden; }
        .day-head { background: #f1f5f9; padding: 18px 10px; text-align: center; border-bottom: 1px solid var(--border); }
        .day-t { font-weight: 800; font-size: 0.75rem; color: var(--primary); text-transform: uppercase; }
        .sim-task { margin: 6px; padding: 10px; border-radius: 12px; font-size: 0.58rem; font-weight: 700; color: white; line-height: 1.3; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        .folder { background: white; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 12px; overflow: hidden; }
        .folder-header { padding: 18px 22px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: #f8fafc; border-bottom: 1px solid var(--border); }
        .folder-content { display: none; padding: 10px; border-top: 1px solid var(--border); }
        .folder-content.open { display: block; }

        .btn { padding: 14px 22px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
        .btn-sm { padding: 6px 12px; font-size: 0.7rem; }
        input, select, textarea { padding: 14px 18px; border: 1px solid var(--border); border-radius: 14px; background: #f1f5f9; width: 100%; margin-top: 8px; font-family: inherit; }

        #login-screen { position: fixed; inset: 0; background: var(--primary); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 60px; border-radius: 35px; width: 420px; text-align: center; }
        .page { display: none; } .page.active { display: block; }
        input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); cursor: pointer; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-card">
            <h2 style="margin-bottom: 10px; font-weight: 800;">OMNI NEXUS v.114</h2>
            <input type="password" id="pass-input" placeholder="Sua Chave" style="text-align:center; letter-spacing: 5px;">
            <button class="btn" style="width:100%; margin-top:25px;" onclick="checkAccess()">ENTRAR</button>
        </div>
    </div>

    <aside class="sidebar">
        <div class="logo-box"><i class="fas fa-brain"></i> OMNI v.114</div>
        <div class="nav-item active" onclick="showTab('diaria', this)"><i class="fas fa-calendar-day"></i><span>Painel Hoje</span></div>
        <div class="nav-item" onclick="showTab('performance', this)"><i class="fas fa-chart-line"></i><span>Performance</span></div>
        <div class="nav-item" onclick="showTab('semanal', this)"><i class="fas fa-calendar-week"></i><span>Cronograma Semanal</span></div>
        <div class="nav-item" onclick="toggleSub()"><i class="fas fa-sliders"></i><span>Meu Plano</span><i class="fas fa-chevron-down" style="margin-left:auto;"></i></div>
        <div id="sub-plano" class="submenu">
            <div class="sub-link" onclick="showTab('edital')">Importar Edital</div>
            <div class="sub-link" onclick="showTab('ciclo')">Ciclo Ativo</div>
            <div class="sub-link" onclick="showTab('config-h')">Horas Diárias</div>
            <div class="sub-link" onclick="showTab('sinalizar')">Sinalizar Base</div>
            <div class="sub-link" onclick="showTab('fluxo')">Ajustar Fluxos</div>
        </div>
    </aside>

    <main class="main">
        <div class="container">
            <div class="stats-grid">
                <div class="stat-card"><small>Carga Restante</small><div id="total-remaining-hrs" class="stat-val">0h</div></div>
                <div class="stat-card"><small>Precisão Geral</small><div id="global-accuracy" class="stat-val">0%</div></div>
                <div class="stat-card"><small>Status IA</small><div class="stat-val" style="color:var(--accent)">SINCRO</div></div>
            </div>

            <div id="diaria" class="page active">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
                    <div id="nav-left" style="width:180px;"></div>
                    <h1 id="date-title" style="font-weight:800; text-align:center;">Hoje</h1>
                    <div id="nav-right" style="width:180px; text-align:right;">
                        <button class="btn btn-outline" onclick="changeDay(1)">VER AMANHÃ <i class="fas fa-arrow-right"></i></button>
                    </div>
                </div>
                <div id="lista-diaria"></div>
            </div>

            <div id="semanal" class="page">
                <h1 style="margin-bottom:25px; font-weight:800;">Cronograma de 7 Dias</h1>
                <div style="overflow-x:auto;"><div id="grid-semanal" class="grid-7"></div></div>
            </div>

            <div id="performance" class="page">
                <div class="stats-grid">
                    <div class="stat-card"><canvas id="chart1"></canvas></div>
                    <div class="stat-card"><canvas id="chart2"></canvas></div>
                </div>
            </div>

            <div id="edital" class="page">
                <div class="stat-card" style="padding:30px;">
                    <input type="text" id="add-mat" placeholder="Nome da Matéria">
                    <select id="h-e-default" style="margin-top:15px;">
                        <option value="0.5">30 Minutos</option><option value="1">60 Minutos</option>
                        <option value="1.5" selected>90 Minutos</option><option value="2">2 Horas</option>
                    </select>
                    <textarea id="add-ass" placeholder="Assuntos (um por linha)..." style="height:150px; margin-top:15px;"></textarea>
                    <button class="btn" style="width:100%; margin-top:15px;" onclick="importarEdital()">IMPORTAR AGORA</button>
                </div>
            </div>

            <div id="ciclo" class="page"><div id="checks-ciclo" class="stat-card" style="columns:2; padding:30px;"></div><button class="btn" style="width:100%; margin-top:20px;" onclick="salvarCiclo()">ATIVAR CICLO</button></div>
            <div id="config-h" class="page"><div id="grid-h-inputs" style="display:flex; gap:10px; justify-content:center; padding:30px;"></div><button class="btn" style="width:100%;" onclick="salvarHoras()">SALVAR CARGA</button></div>
            <div id="sinalizar" class="page"><div id="tree-container"></div></div>
            <div id="fluxo" class="page"><div id="corpo-fluxo"></div></div>
        </div>
    </main>
<script>
    /* ENGINE v.114 - THE ARCHITECT (CORE LOGIC)
       Foco: Simulação 7 dias sem repetição + Rito Linear Blindado
    */
    let db = JSON.parse(localStorage.getItem('prf_v114')) || { 
        lista: [], ciclo: [], h: {1:4,2:4,3:4,4:4,5:4,6:4,0:4}, metaFixa: {} 
    };
    let currentViewDate = new Date();

    const save = () => localStorage.setItem('prf_v114', JSON.stringify(db));
    const formatTime = (h) => {
        h = parseFloat(h);
        if(h === 0.5) return "30m"; if(h === 1) return "60m";
        if(h === 1.5) return "90m"; if(h === 2) return "2h";
        return Math.round(h * 60) + "m";
    };

    function checkAccess() { 
        if(document.getElementById('pass-input').value === "123") { 
            document.getElementById('login-screen').style.display='none'; 
            init(); 
        } 
    }

    function init() { 
        renderHInputs(); 
        renderDiario(currentViewDate); 
        renderCiclo(); 
        updateGlobalStats(); 
    }

    function showTab(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active'); if(el) el.classList.add('active');
        if(id === 'semanal') renderSemanalIA();
        if(id === 'sinalizar') renderTree();
        if(id === 'fluxo') renderFluxo();
    }

    function toggleSub() { document.getElementById('sub-plano').classList.toggle('show'); }

    // --- MOTOR DE GERAÇÃO NEURAL (RITO LINEAR) ---
    function getPool(limit, simList) {
        let pool = []; let somaH = 0;
        if(!db.ciclo.length) return pool;

        let safety = 0;
        while(somaH < limit && safety < 100) {
            safety++; let addedAny = false;
            for(let m of db.ciclo) {
                if(somaH >= limit) break;
                
                // Busca o assunto atual da matéria no rito linear
                let it = simList.find(x => x.m === m && !x.f);
                if(!it) continue;

                const rito = [
                    {k:'E', l:'Estudo', h: parseFloat(it.hE || 1.5)},
                    {k:'Rev', l:'Revisão', h:1},
                    {k:'Ex', l:'Exercícios', h:1}
                ];

                for(let s of rito) {
                    if(!it.done[s.k]) {
                        if(s.k === 'E') {
                            let pendente = s.h - (it.hFeito || 0);
                            let disp = limit - somaH;
                            let alocar = Math.min(pendente, disp);
                            if(alocar > 0) {
                                pool.push({ m: it.m, a: it.a, label: s.l, key: s.k, hrs: alocar });
                                it.hFeito = (it.hFeito || 0) + alocar;
                                if(it.hFeito >= s.h - 0.01) it.done.E = true;
                                somaH += alocar; addedAny = true;
                            }
                        } else {
                            if(somaH + s.h <= limit + 0.05) {
                                pool.push({ m: it.m, a: it.a, label: s.l, key: s.k, hrs: s.h });
                                it.done[s.k] = true; somaH += s.h; addedAny = true;
                                if(s.k === 'Ex') it.f = true;
                            }
                        }
                        break; // Bloqueio Linear: Não pula para o próximo assunto
                    }
                }
                if(addedAny) break; 
            }
            if(!addedAny) break;
        } return pool;
    }

    // --- PAINEL HOJE / NAVEGAÇÃO ---
    function renderDiario(date) {
        const hj = new Date().toLocaleDateString();
        const cur = date.toLocaleDateString();
        const hMeta = parseFloat(db.h[date.getDay()]);
        
        document.getElementById('date-title').innerText = (hj === cur) ? "Hoje" : cur;
        document.getElementById('nav-left').innerHTML = (hj === cur) ? "" : 
            `<button class="btn btn-outline btn-sm" onclick="changeDay(0)"><i class="fas fa-undo"></i> VOLTAR HOJE</button>`;

        // Se for futuro ou não houver meta fixa, gera simulação baseada no banco real atual
        if(!db.metaFixa[cur] || cur !== hj) {
            let simL = JSON.parse(JSON.stringify(db.lista));
            db.metaFixa[cur] = getPool(hMeta, simL);
        }

        const tasks = db.metaFixa[cur];
        document.getElementById('meta-status').innerText = `${tasks.reduce((a,b)=>a+b.hrs,0).toFixed(1)}h / ${hMeta}h meta`;
        
        document.getElementById('lista-diaria').innerHTML = tasks.map((t, i) => `
            <div class="task-card" style="border-left-color:var(--color-${t.key === 'Ex' ? 'ex' : (t.key === 'Rev' ? 'rev' : 'e')})">
                <div>
                    <span class="tag tag-${t.key.toLowerCase()}">${t.label} (${formatTime(t.hrs)})</span>
                    <div style="font-weight:800; font-size:1.1rem;">${t.m}: ${t.a}</div>
                </div>
                <input type="checkbox" ${t.c ? 'checked' : ''} onclick="concluirTask('${cur}', ${i})">
            </div>`).join('') || "<p style='text-align:center; padding:40px; color:gray;'>Ciclo inativo.</p>";
    }

    function changeDay(dir) {
        if(dir === 0) currentViewDate = new Date();
        else currentViewDate.setDate(currentViewDate.getDate() + dir);
        renderDiario(currentViewDate);
    }

    function concluirTask(dateKey, idx) {
        let t = db.metaFixa[dateKey][idx]; t.c = !t.c;
        let it = db.lista.find(x => x.m === t.m && x.a === t.a);
        if(it) {
            if(t.key === 'E') {
                it.hEstudada = (it.hEstudada || 0) + (t.c ? t.hrs : -t.hrs);
                it.done.E = it.hEstudada >= (it.hE - 0.1);
            } else {
                it.done[t.key] = t.c;
                if(t.key === 'Ex') it.f = t.c;
            }
        }
        save(); updateGlobalStats();
    }

    // --- SEMANAL IA (SIMULAÇÃO PROFUNDA) ---
    function renderSemanalIA() {
        const dias = ["DOM", "SEG", "TER", "QUA", "QUI", "SEX", "SÁB"];
        let virtualList = JSON.parse(JSON.stringify(db.lista));
        
        document.getElementById('grid-semanal').innerHTML = [0,1,2,3,4,5,6].map(off => {
            let d = new Date(); d.setDate(d.getDate() + off);
            let hLimit = parseFloat(db.h[d.getDay()]);
            let dayTasks = getPool(hLimit, virtualList); // virtualList é alterada para o dia seguinte
            
            return `<div class="day-column">
                <div class="day-head"><div class="day-t">${dias[d.getDay()]} - ${d.getDate()}</div></div>
                ${dayTasks.map(x => `<div class="sim-task tag-${x.key.toLowerCase()}"><b>${x.m}</b><br>${x.a}</div>`).join('')}
            </div>`;
        }).join('');
    }

    // --- IMPORTAÇÃO E CONFIGS ---
    function importarEdital() {
        const m = document.getElementById('add-mat').value;
        const hE = parseFloat(document.getElementById('h-e-default').value);
        const ass = document.getElementById('add-ass').value.split('\n').filter(l => l.trim().length > 1);
        if(!m || !ass.length) return alert("Dados incompletos");
        ass.forEach(a => db.lista.push({ m, a: a.trim(), hE, f:false, done:{E:false,Rev:false,Ex:false}, hEstudada:0 }));
        save(); init(); alert("Importado!");
    }

    function renderTree() {
        const mats = [...new Set(db.lista.map(x => x.m))];
        document.getElementById('tree-container').innerHTML = mats.map(m => `
            <div class="folder">
                <div class="folder-header" onclick="this.nextElementSibling.classList.toggle('open')">
                    <b>${m}</b>
                    <button class="btn btn-sm btn-outline" onclick="event.stopPropagation(); toggleMateria('${m}')">Alternar Tudo</button>
                </div>
                <div class="folder-content">
                    ${db.lista.filter(x => x.m === m).map(a => `
                        <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #eee;">
                            <span>${a.a}</span>
                            <input type="checkbox" ${a.done.E?'checked':''} onclick="toggleSubject('${a.m}','${a.a}')">
                        </div>
                    `).join('')}
                </div>
            </div>`).join('');
    }

    function toggleMateria(m) {
        let ass = db.lista.filter(x => x.m === m);
        let target = !ass[0].done.E;
        ass.forEach(a => {
            a.done.E = target; a.done.Rev = target; a.done.Ex = target; a.f = target;
            a.hEstudada = target ? a.hE : 0;
        });
        db.metaFixa = {}; save(); init(); renderTree();
    }

    function toggleSubject(m, a) {
        let it = db.lista.find(x => x.m === m && x.a === a);
        it.done.E = !it.done.E;
        if(!it.done.E) { it.done.Rev = false; it.done.Ex = false; it.f = false; it.hEstudada = 0; }
        db.metaFixa = {}; save(); init();
    }

    function renderHInputs() {
        const d = ["DOM", "SEG", "TER", "QUA", "QUI", "SEX", "SÁB"];
        document.getElementById('grid-h-inputs').innerHTML = d.map((x,i) => `
            <div style="text-align:center;"><small style="font-weight:800;">${x}</small><br>
            <input type="number" id="h-in-${i}" value="${db.h[i]}" style="width:55px; text-align:center;"></div>`).join('');
    }

    function salvarHoras() {
        for(let i=0; i<7; i++) db.h[i] = parseFloat(document.getElementById(`h-input-${i}`)?.value || document.getElementById(`h-in-${i}`).value);
        db.metaFixa = {}; save(); init(); alert("Salvo!");
    }

    function renderCiclo() {
        const mats = [...new Set(db.lista.map(x => x.m))];
        document.getElementById('checks-ciclo').innerHTML = mats.map(m => `
            <label style="display:block; margin-bottom:10px; font-weight:700;">
                <input type="checkbox" class="ckc" value="${m}" ${db.ciclo.includes(m)?'checked':''}> ${m}
            </label>`).join('');
    }

    function salvarCiclo() {
        db.ciclo = Array.from(document.querySelectorAll('.ckc:checked')).map(c => c.value);
        db.metaFixa = {}; save(); init(); alert("Ciclo Ativo!");
    }

    function renderFluxo() {
        document.getElementById('corpo-fluxo').innerHTML = db.lista.map((it, i) => `
            <div class="stat-card" style="margin-bottom:10px;">
                <b>${it.m}: ${it.a}</b><br>
                <small>H Estudo:</small> <input type="number" value="${it.hE}" onchange="db.lista[${i}].hE=this.value;save();">
            </div>`).join('');
    }

    function updateGlobalStats() {
        let total = db.lista.length * 3;
        let done = 0;
        db.lista.forEach(a => { if(a.done.E) done++; if(a.done.Rev) done++; if(a.done.Ex) done++; });
        let p = total > 0 ? (done/total)*100 : 0;
        document.getElementById('global-accuracy').innerText = Math.round(p) + "%";
        document.getElementById('total-remaining-hrs').innerText = ((total - done) * 1.5).toFixed(0) + "h";
    }
</script>
</body>
</html>
