<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI NEXUS v1.5.0 - ACTIVE DAY</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #0f172a; --accent: #0ea5e9; --bg: #f8fafc;
            --border: #e2e8f0; --text-main: #1e293b; --text-sec: #64748b;
            --color-e: #0ea5e9; --color-rev: #f59e0b; --color-ex: #10b981;
            --gold: #fbbf24; --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR */
        .sidebar { width: 280px; background: var(--primary); padding: 30px 20px; display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; z-index: 1000; }
        .logo-box { color: white; font-weight: 800; font-size: 1.5rem; margin-bottom: 25px; display: flex; align-items: center; gap: 12px; }
        .profile-card { background: rgba(255,255,255,0.05); border-radius: var(--radius); padding: 15px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1); }
        .lvl-badge { background: var(--gold); color: var(--primary); padding: 2px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; display: inline-block; }
        .xp-bar-bg { background: rgba(255,255,255,0.1); height: 6px; border-radius: 10px; margin-top: 10px; overflow: hidden; }
        .xp-bar-fill { background: var(--gold); height: 100%; width: 0%; transition: 1s cubic-bezier(0.4, 0, 0.2, 1); }

        .nav-item { padding: 14px 16px; color: #94a3b8; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 600; border-radius: 12px; margin-bottom: 6px; transition: 0.3s; font-size: 0.9rem; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.08); color: white; }
        .nav-item.active { background: var(--accent); box-shadow: 0 8px 15px rgba(14, 165, 233, 0.2); }
        
        .submenu { margin-left: 20px; border-left: 2px solid rgba(255,255,255,0.05); display: none; flex-direction: column; }
        .submenu.show { display: flex; }
        .sub-link { padding: 10px 20px; color: #64748b; font-size: 0.8rem; cursor: pointer; transition: 0.2s; font-weight: 600; }
        .sub-link:hover { color: white; }

        /* MAIN */
        .main { flex: 1; overflow-y: auto; padding: 30px; position: relative; background: var(--bg); }
        .container { max-width: 1100px; margin: 0 auto; }
        .page { display: none; } .page.active { display: block; }

        /* DASHBOARD NAV */
        .day-nav { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 25px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 25px; }
        .day-indicator { display: flex; flex-direction: column; }
        .day-indicator b { font-size: 1.2rem; color: var(--primary); }
        .day-indicator span { font-size: 0.8rem; color: var(--text-sec); font-weight: 700; }

        .dash-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .stat-val { font-size: 1.5rem; font-weight: 800; color: var(--primary); display: block; }
        .stat-label { font-size: 0.7rem; font-weight: 800; color: var(--text-sec); text-transform: uppercase; }

        .task-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; border: 1px solid var(--border); border-left: 10px solid #ccc; position: relative; transition: 0.3s; }
        .tag-type { color: white; font-size: 0.65rem; padding: 5px 12px; border-radius: 50px; font-weight: 800; display: inline-block; margin: 8px 0; text-transform: uppercase; }
        
        .overdrive-card { background: #ecfdf5; border: 2px dashed #10b981; padding: 25px; border-radius: var(--radius); text-align: center; margin-bottom: 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .grid-7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; min-width: 900px; }
        .day-column { background: white; border-radius: var(--radius); border: 1px solid var(--border); min-height: 500px; display: flex; flex-direction: column; overflow: hidden; }
        .day-head { background: #f8fafc; padding: 15px 10px; text-align: center; border-bottom: 1px solid var(--border); font-weight: 800; font-size: 0.75rem; color: var(--primary); }
        .sim-task { margin: 5px; padding: 10px; border-radius: 8px; font-size: 0.65rem; color: white; font-weight: 700; line-height: 1.3; }

        .btn { padding: 12px 20px; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; transition: 0.2s; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
        .btn-success { background: var(--color-ex); color: white; }
        .btn-outline { background: white; border: 2px solid var(--border); }
        
        /* FOLDERS */
        .folder { background: white; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 10px; overflow: hidden; }
        .folder-header { padding: 18px 25px; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; cursor: pointer; font-weight: 800; }
        .folder-content { display: none; padding: 15px 25px; border-top: 1px solid var(--border); }
        .folder-content.active { display: block; }

        input, select, textarea { padding: 12px; border-radius: 8px; border: 1px solid var(--border); width: 100%; background: #f8fafc; font-family: inherit; font-weight: 600; }
        #login-screen { position: fixed; inset: 0; background: var(--primary); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div style="background:white; padding:50px; border-radius:30px; text-align:center; width:400px;">
            <h2 style="margin-bottom:10px; font-weight: 800;">OMNI NEXUS v1.5.0</h2>
            <input type="password" id="pass-input" placeholder="Chave de Acesso" style="text-align:center; margin-bottom: 20px; font-size: 1.2rem; padding:15px;">
            <button class="btn" style="width:100%; background:var(--accent); color:white; padding: 18px;" onclick="App.checkAccess()">ENTRAR</button>
        </div>
    </div>

    <aside class="sidebar">
        <div class="logo-box"><i class="fas fa-shield-halved" style="color:var(--accent);"></i> OMNI v1.5</div>
        <div class="profile-card">
            <span class="lvl-badge" id="lvl-txt">Iniciante</span>
            <div style="color:white; font-weight:800; font-size:1.1rem;" id="xp-total">0 XP</div>
            <div class="xp-bar-bg"><div class="xp-bar-fill" id="xp-fill"></div></div>
        </div>
        <div class="nav-item active" onclick="App.showTab('diaria', this)"><i class="fas fa-rocket"></i><span>Dia Ativo</span></div>
        <div class="nav-item" onclick="App.showTab('semanal', this)"><i class="fas fa-calendar-week"></i><span>Cronograma</span></div>
        <div class="nav-item" onclick="App.showTab('performance', this)"><i class="fas fa-chart-line"></i><span>Performance</span></div>
        <div class="nav-item" onclick="App.toggleSub()"><i class="fas fa-gears"></i><span>Configurações</span><i class="fas fa-chevron-down" style="margin-left:auto;"></i></div>
        <div id="sub-plano" class="submenu">
            <div class="sub-link" onclick="App.showTab('edital')">Importar Edital</div>
            <div class="sub-link" onclick="App.showTab('ciclo')">Ciclo Ativo</div>
            <div class="sub-link" onclick="App.showTab('config-h')">Editar Horas</div>
            <div class="sub-link" onclick="App.showTab('sinalizar')">Sinalizar Base</div>
            <div class="sub-link" onclick="App.showTab('fluxo')">Ajustar Fluxos</div>
            <div class="sub-link" style="color:#ef4444;" onclick="App.showTab('replanejar')">Zerar Atrasos</div>
        </div>
    </aside>

    <main class="main">
        <div class="container">
            
            <div id="diaria" class="page active">
                <div class="day-nav">
                    <button class="btn btn-outline" id="btn-prev-day" onclick="App.changeActiveDay(-1)">
                        <i class="fas fa-chevron-left"></i> Voltar para Hoje
                    </button>
                    <div class="day-indicator">
                        <span id="day-status-label">ESTADO ATUAL</span>
                        <b id="active-day-display">--/--</b>
                    </div>
                    <button class="btn btn-outline" id="btn-next-day" onclick="App.changeActiveDay(1)">
                        Avançar <i class="fas fa-chevron-right"></i>
                    </button>
                </div>

                <div id="overdrive-container"></div>

                <div class="dash-grid">
                    <div class="stat-card"><span class="stat-label">🔥 Streak</span><span class="stat-val" id="d-streak">0</span></div>
                    <div class="stat-card"><span class="stat-label">🏆 XP do Dia</span><span class="stat-val" id="d-xp-hoje">0</span></div>
                    <div class="stat-card"><span class="stat-label">⏳ Horas</span><span class="stat-val" id="d-h-total">0h</span></div>
                    <div class="stat-card"><span class="stat-label">🎯 Acerto</span><span class="stat-val" id="d-acerto">0%</span></div>
                </div>

                <div id="lista-diaria"></div>
            </div>

            <div id="semanal" class="page"><div id="grid-semanal" class="grid-7"></div></div>
            <div id="performance" class="page">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;"><canvas id="chartProgresso"></canvas><canvas id="chartRendimento"></canvas></div>
                <div id="perf-table-container"></div>
            </div>
            <div id="config-h" class="page">
                <div class="stat-card">
                    <h3>Editar Disponibilidade</h3>
                    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; margin-top:20px;">
                        <div><label class="stat-label">Segunda a Sexta</label><input type="number" id="h-week" placeholder="4"></div>
                        <div><label class="stat-label">Sábado</label><input type="number" id="h-sab" placeholder="6"></div>
                        <div><label class="stat-label">Domingo</label><input type="number" id="h-dom" placeholder="2"></div>
                    </div>
                    <button class="btn btn-success" style="width:100%; margin-top:20px;" onclick="App.saveHMaster()">SALVAR CARGA</button>
                </div>
            </div>
            <div id="edital" class="page"><div class="stat-card"><h3>Importar Matéria</h3><input type="text" id="add-mat" placeholder="Matéria"><textarea id="add-ass" placeholder="Assuntos..."></textarea><button class="btn btn-success" onclick="App.impEdital()">IMPORTAR</button></div></div>
            <div id="ciclo" class="page"><div id="check-c"></div><button class="btn btn-success" onclick="App.saveC()">SALVAR CICLO</button></div>
            <div id="sinalizar" class="page"><div id="tree"></div></div>
            <div id="fluxo" class="page"><div id="fluxo-content"></div></div>
            <div id="replanejar" class="page"><div class="stat-card"><button class="btn btn-danger" onclick="App.execReplan()">ZERAR ATRASOS</button></div></div>

        </div>
    </main>

    <script>
        const App = {
            state: {
                db: JSON.parse(localStorage.getItem('prf_v150_active')) || {
                    lista: [], ciclo: [], h: {1:4, 2:4, 3:4, 4:4, 5:4, 6:4, 0:4},
                    metaFixa: {}, perf: {}, streak: 0, lastCheck: null, xp: 0, xpHistory: {}, mPesos: {}
                },
                activeDay: new Date().toISOString().split('T')[0],
                today: new Date().toISOString().split('T')[0]
            },

            saveState() {
                localStorage.setItem('prf_v150_active', JSON.stringify(this.state.db));
                console.log("[STATE] Persistido.");
            },

            checkAccess() {
                if(document.getElementById('pass-input').value === "123") {
                    document.getElementById('login-screen').style.display='none';
                    this.init();
                } else alert("Acesso negado.");
            },

            init() {
                console.log("[APP] Dia Ativo:", this.state.activeDay);
                this.renderDashboard();
                this.updateGamification();
            },

            showTab(id, el) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                if(el) el.classList.add('active');
                if(id === 'semanal') this.renderSemanal();
                if(id === 'performance') this.renderPerformance();
                if(id === 'sinalizar') this.renderSinalizar();
                if(id === 'ciclo') this.renderCiclo();
                if(id === 'fluxo') this.renderFluxo();
            },

            // --- NAVEGAÇÃO DE DIA ATIVO ---
            changeActiveDay(direction) {
                const current = new Date(this.state.activeDay + "T12:00:00");
                current.setDate(current.getDate() + direction);
                const target = current.toISOString().split('T')[0];

                // Limite: Não voltar antes de hoje e não avançar mais que 1 dia do planejado
                if (target < this.state.today) {
                    this.state.activeDay = this.state.today;
                } else if (direction > 0) {
                    const diff = (current - new Date(this.state.today + "T12:00:00")) / (1000 * 60 * 60 * 24);
                    if (diff > 1) return alert("Você só pode adiantar 1 dia por vez!");
                    this.state.activeDay = target;
                } else {
                    this.state.activeDay = target;
                }

                console.log("[NAV] Transição de Dia para:", this.state.activeDay);
                this.renderDashboard();
            },

            getOrCreateDailyPlan(isoDate) {
                if (this.state.db.metaFixa[isoDate]) return this.state.db.metaFixa[isoDate];

                const dateObj = new Date(isoDate + "T12:00:00");
                const limit = this.state.db.h[dateObj.getDay()];
                const simList = JSON.parse(JSON.stringify(this.state.db.lista));
                
                // Motor Neural de Alocação
                const plan = this.getNeuralPool(limit, simList, isoDate);
                this.state.db.metaFixa[isoDate] = plan;
                this.saveState();
                return plan;
            },

            getNeuralPool(limit, simList, isoDate) {
                let pool = []; let somaH = 0;
                if(!this.state.db.ciclo.length) return pool;
                
                for(let mName of this.state.db.ciclo) {
                    if(somaH >= limit) break;
                    let item = simList.find(x => x.m === mName && !x.f);
                    if(item) {
                        const rito = [{k:'E', l:'Estudo', h:parseFloat(item.h.E)}, {k:'Rev', l:'Revisão', h:parseFloat(item.h.Rev)}, {k:'Ex', l:'Exercícios', h:parseFloat(item.h.Ex)}];
                        for(let s of rito) {
                            if(!item.done[s.k] && somaH + s.h <= limit + 0.1) {
                                pool.push({m:item.m, a:item.a, l:s.l, k:s.k, h:s.h, c: false});
                                item.done[s.k] = true; somaH += s.h;
                                if(s.k === 'Ex') item.f = true;
                                break;
                            }
                        }
                    }
                }
                return pool;
            },

            renderDashboard() {
                const tasks = this.getOrCreateDailyPlan(this.state.activeDay);
                const container = document.getElementById('lista-diaria');
                const overdrive = document.getElementById('overdrive-container');
                const [y, m, d] = this.state.activeDay.split('-');

                document.getElementById('active-day-display').innerText = `${d}/${m}`;
                document.getElementById('day-status-label').innerText = this.state.activeDay === this.state.today ? "HOJE" : "AMANHÃ (ADIANTADO)";
                
                container.innerHTML = "";
                overdrive.innerHTML = "";

                // Verifica se tudo está concluído
                const allDone = tasks.length > 0 && tasks.every(t => t.c);
                if (allDone && this.state.activeDay === this.state.today) {
                    overdrive.innerHTML = `
                        <div class="overdrive-card">
                            <h3>🚀 TODAS AS METAS BATIDAS!</h3>
                            <p>Você concluiu o dia de hoje. Deseja adiantar as matérias de amanhã?</p>
                            <button class="btn btn-success" style="margin-top:15px;" onclick="App.changeActiveDay(1)">SIM, ADIANTAR AMANHÃ</button>
                        </div>`;
                }

                tasks.forEach((t, i) => {
                    const col = t.k === 'Ex' ? 'ex' : (t.k === 'Rev' ? 'rev' : 'e');
                    container.innerHTML += `
                        <div class="task-card" style="border-left-color:var(--color-${col})">
                            <div style="display:flex; justify-content:space-between;">
                                <b>${t.m}</b>
                                <span style="font-size:0.7rem; font-weight:800; color:var(--text-sec);">XP +50</span>
                            </div>
                            <p style="margin:5px 0; font-weight:600;">${t.a}</p>
                            <span class="tag-type" style="background:var(--color-${col})">${t.l} | ${t.h}h</span>
                            <input type="checkbox" style="float:right; width:22px; height:22px;" ${t.c ? 'checked' : ''} 
                                onclick="App.concluirTask('${this.state.activeDay}', ${i})">
                        </div>`;
                });
                
                this.updateGamification();
            },

            concluirTask(isoDate, idx) {
                let t = this.state.db.metaFixa[isoDate][idx];
                t.c = !t.c;
                
                if(t.c) {
                    this.addXP(50);
                    if(t.k === 'Ex') {
                        let q = parseInt(prompt("Questões resolvidas?"));
                        let a = parseInt(prompt("Acertos?"));
                        if(q > 0) {
                            let k = t.m + '-' + t.a;
                            if(!this.state.db.perf[k]) this.state.db.perf[k] = {q:0, a:0, h:0};
                            this.state.db.perf[k].q += q; this.state.db.perf[k].a += a;
                            this.addXP(q * 2);
                        }
                    }
                }
                
                // Sincronização global
                let it = this.state.db.lista.find(x => x.m === t.m && x.a === t.a);
                if(it) {
                    if(t.k==='E') it.done.E = t.c;
                    else if(t.k==='Rev') it.done.Rev = t.c;
                    else if(t.k==='Ex') { it.done.Ex = t.c; it.f = t.c; }
                }

                if(t.c) {
                    this.state.db.lastCheck = this.state.today;
                    this.state.db.streak++;
                }

                this.saveState();
                this.renderDashboard();
            },

            updateGamification() {
                const xp = this.state.db.xp;
                const hjXP = this.state.db.xpHistory[this.state.activeDay] || 0;
                
                document.getElementById('xp-total').innerText = xp + " XP";
                document.getElementById('d-xp-hoje').innerText = hjXP;
                document.getElementById('xp-fill').style.width = Math.min((xp/5000)*100, 100) + "%";
                document.getElementById('d-streak').innerText = this.state.db.streak;

                // Cálculo de rendimento do dia ativo
                const tasks = this.state.db.metaFixa[this.state.activeDay] || [];
                const hTot = tasks.filter(t=>t.c).reduce((a,b)=>a+b.h, 0);
                document.getElementById('d-h-total').innerText = hTot.toFixed(1) + "h";
            },

            addXP(val) {
                this.state.db.xp += val;
                this.state.db.xpHistory[this.state.activeDay] = (this.state.db.xpHistory[this.state.activeDay] || 0) + val;
                this.updateGamification();
            },

            // --- AUX RENDERERS ---
            renderSemanal() {
                const grid = document.getElementById('grid-semanal');
                grid.innerHTML = "";
                const simL = JSON.parse(JSON.stringify(this.state.db.lista));
                for(let i=0; i<7; i++) {
                    const d = new Date(this.state.today + "T12:00:00");
                    d.setDate(d.getDate() + i);
                    const iso = d.toISOString().split('T')[0];
                    const tasks = this.getOrCreateDailyPlan(iso);
                    grid.innerHTML += `<div class="day-column"><div class="day-head">${iso.split('-')[2]}/${iso.split('-')[1]}</div>
                        <div style="padding:5px;">${tasks.map(x=>`<div class="sim-task" style="background:var(--color-${x.k==='Ex'?'ex':(x.k==='Rev'?'rev':'e')})">${x.m}<br>${x.a}</div>`).join('')}</div></div>`;
                }
            },

            renderSinalizar() {
                const tree = document.getElementById('tree'); tree.innerHTML = "";
                [...new Set(this.state.db.lista.map(x=>x.m))].forEach(m => {
                    tree.innerHTML += `<div class="folder"><div class="folder-header" onclick="this.nextElementSibling.classList.toggle('active')">${m}</div>
                        <div class="folder-content">${this.state.db.lista.filter(x=>x.m===m).map(a => `
                        <div style="display:flex; justify-content:space-between; padding:8px 0;"><span>${a.a}</span>
                        <div>E<input type="checkbox" ${a.done.E?'checked':''} onclick="App.tItm('${a.m}','${a.a}','E')">
                             R<input type="checkbox" ${a.done.Rev?'checked':''} onclick="App.tItm('${a.m}','${a.a}','Rev')">
                             X<input type="checkbox" ${a.done.Ex?'checked':''} onclick="App.tItm('${a.m}','${a.a}','Ex')"></div></div>`).join('')}</div></div>`;
                });
            },

            saveHMaster() {
                const w = parseFloat(document.getElementById('h-week').value) || 4;
                const s = parseFloat(document.getElementById('h-sab').value) || 6;
                const d = parseFloat(document.getElementById('h-dom').value) || 2;
                for(let i=1; i<=5; i++) this.state.db.h[i] = w; this.state.db.h[6] = s; this.state.db.h[0] = d;
                this.state.db.metaFixa = {}; this.saveState(); this.init(); alert("Carga Salva!");
            },

            toggleSub() { document.getElementById('sub-plano').classList.toggle('show'); },
            execReplan() { this.state.db.metaFixa = {}; this.saveState(); window.location.reload(); }
        };

        document.addEventListener('DOMContentLoaded', () => console.log("[SYSTEM] Pronto."));
    </script>
</body>
</html>
