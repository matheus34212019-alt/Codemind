<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI NEXUS v1.7.5 - ULTIMATE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #0f172a; --accent: #0ea5e9; --bg: #f8fafc;
            --border: #e2e8f0; --text-main: #1e293b; --text-sec: #64748b;
            --color-e: #0ea5e9; --color-rev: #f59e0b; --color-ex: #10b981;
            --gold: #fbbf24; --radius: 18px; --shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR */
        .sidebar { width: 280px; background: var(--primary); padding: 30px 20px; display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; border-right: 1px solid rgba(255,255,255,0.05); }
        .logo-box { color: white; font-weight: 800; font-size: 1.4rem; margin-bottom: 25px; display: flex; align-items: center; gap: 12px; }
        
        .profile-card { background: rgba(255,255,255,0.05); border-radius: var(--radius); padding: 20px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1); }
        .lvl-badge { background: var(--gold); color: var(--primary); padding: 3px 10px; border-radius: 8px; font-size: 0.7rem; font-weight: 900; text-transform: uppercase; margin-bottom: 12px; display: inline-block; }
        .xp-bar-bg { background: rgba(255,255,255,0.1); height: 10px; border-radius: 10px; overflow: hidden; }
        .xp-bar-fill { background: var(--gold); height: 100%; width: 0%; transition: 1s; }

        .nav-item { padding: 14px 18px; color: #94a3b8; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 600; border-radius: 14px; margin-bottom: 8px; transition: 0.3s; font-size: 0.9rem; }
        .nav-item.active { background: var(--accent); color: white; box-shadow: 0 10px 15px rgba(14, 165, 233, 0.2); }
        
        .submenu { margin-left: 20px; border-left: 2px solid rgba(255,255,255,0.1); display: none; flex-direction: column; margin-bottom: 15px; }
        .submenu.show { display: flex; }
        .sub-link { padding: 10px 20px; color: #64748b; font-size: 0.8rem; cursor: pointer; font-weight: 600; }
        .sub-link:hover { color: white; }

        /* MAIN AREA */
        .main { flex: 1; overflow-y: auto; padding: 30px; background: var(--bg); position: relative; scroll-behavior: smooth; }
        .container { max-width: 1100px; margin: 0 auto; }
        .page { display: none; animation: fadeIn 0.4s ease; } 
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* CARDS & DASHBOARD */
        .stat-card { background: white; padding: 22px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 20px; }
        .stat-val { font-size: 1.6rem; font-weight: 800; color: var(--primary); display: block; margin-top: 5px; }
        .stat-label { font-size: 0.7rem; font-weight: 800; color: var(--text-sec); text-transform: uppercase; }

        .task-card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 20px; border: 1px solid var(--border); border-left: 12px solid #ccc; position: relative; box-shadow: var(--shadow); }
        .task-date-tag { position: absolute; top: 15px; right: 20px; font-size: 0.7rem; font-weight: 800; color: var(--text-sec); background: #f1f5f9; padding: 5px 12px; border-radius: 6px; }

        /* CRONÔMETRO */
        .timer-box { display: flex; align-items: center; gap: 15px; background: #f8fafc; padding: 12px 20px; border-radius: 12px; margin-top: 15px; border: 1px solid var(--border); }
        .timer-display { font-family: 'Courier New', monospace; font-weight: 900; font-size: 1.4rem; color: var(--primary); }

        /* GRID CRONOGRAMA */
        .grid-7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; min-width: 1000px; }
        .day-column { background: white; border-radius: var(--radius); border: 1px solid var(--border); min-height: 550px; display: flex; flex-direction: column; overflow: hidden; }
        .day-head { background: #f1f5f9; padding: 15px; text-align: center; font-weight: 800; font-size: 0.75rem; border-bottom: 1px solid var(--border); color: var(--primary); }
        .day-head.today { background: var(--accent); color: white; }

        /* REPLANEJAR */
        .replan-banner { background: #fff1f2; border: 2px solid #f43f5e; color: #9f1239; padding: 20px; border-radius: var(--radius); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }

        /* FOLDERS */
        .folder { background: white; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 10px; overflow: hidden; }
        .folder-header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; cursor: pointer; font-weight: 800; }
        .folder-content { display: none; padding: 15px; border-top: 1px solid var(--border); }
        .folder-content.active { display: block; }

        .btn { padding: 14px 24px; border: none; border-radius: 14px; font-weight: 800; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 10px; justify-content: center; }
        .btn-success { background: var(--color-ex); color: white; }
        .btn-outline { background: white; border: 2px solid var(--border); color: var(--text-main); }
        
        #login-screen { position: fixed; inset: 0; background: var(--primary); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div style="background:white; padding:50px; border-radius:30px; text-align:center; width:400px; box-shadow: var(--shadow);">
            <h2 style="margin-bottom:10px; font-weight: 800;">OMNI NEXUS v1.7.5</h2>
            <p style="color: var(--text-sec); margin-bottom: 30px; font-weight: 600;">Comando Central Matheus</p>
            <input type="password" id="pass-input" placeholder="Senha" style="text-align:center; margin-bottom: 20px; width:100%; padding:15px; border-radius:12px; border:1px solid var(--border);">
            <button class="btn btn-success" style="width:100%; background:var(--accent);" onclick="App.checkAccess()">ENTRAR</button>
        </div>
    </div>

    <aside class="sidebar">
        <div class="logo-box"><i class="fas fa-shield-halved" style="color:var(--accent);"></i> OMNI CORE</div>
        <div class="profile-card">
            <span class="lvl-badge" id="lvl-txt">Focado</span>
            <div style="color:white; font-weight:800; font-size:1.1rem;" id="xp-total">0 XP</div>
            <div class="xp-bar-bg"><div class="xp-bar-fill" id="xp-fill"></div></div>
        </div>
        
        <div class="nav-item active" onclick="App.showTab('diaria', this)"><i class="fas fa-rocket"></i> Dashboard</div>
        <div class="nav-item" onclick="App.showTab('semanal', this)"><i class="fas fa-calendar-week"></i> Cronograma</div>
        <div class="nav-item" onclick="App.showTab('performance', this)"><i class="fas fa-chart-line"></i> Performance</div>
        
        <div class="nav-item" onclick="App.toggleSub()"><i class="fas fa-gears"></i> Configurações <i class="fas fa-chevron-down" style="margin-left:auto;"></i></div>
        <div id="sub-plano" class="submenu">
            <div class="sub-link" onclick="App.showTab('edital')">Importar Edital</div>
            <div class="sub-link" onclick="App.showTab('ciclo')">Ciclo Ativo</div>
            <div class="sub-link" onclick="App.showTab('sinalizar')">Sinalizar Base</div>
        </div>
    </aside>

    <main class="main">
        <div class="container">
            <div id="diaria" class="page active">
                <div id="replan-container"></div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
                    <b id="active-day-display" style="font-size:1.4rem; color:var(--primary);">--/--</b>
                    <div id="next-day-container"></div>
                </div>

                <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:20px; margin-bottom:25px;">
                    <div class="stat-card"><span class="stat-label">🔥 Streak</span><span class="stat-val" id="d-streak">0</span></div>
                    <div class="stat-card"><span class="stat-label">🏆 XP Hoje</span><span class="stat-val" id="d-xp-hoje">0</span></div>
                    <div class="stat-card"><span class="stat-label">⏳ Horas</span><span class="stat-val" id="d-h-total">0h</span></div>
                    <div class="stat-card"><span class="stat-label">🎯 Acerto</span><span class="stat-val" id="d-acerto">0%</span></div>
                </div>

                <div id="lista-diaria"></div>

                <div class="stat-card" style="border:2px dashed var(--accent); background:rgba(14,165,233,0.02); margin-top:20px;">
                    <h4 style="margin-bottom:15px;"><i class="fas fa-plus"></i> Estudo Extra</h4>
                    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;">
                        <select id="extra-mat" onchange="App.loadExtraAssuntos()"></select>
                        <select id="extra-ass"></select>
                        <button class="btn btn-success" style="background:var(--accent);" onclick="App.createExtra()">ADICIONAR</button>
                    </div>
                </div>
            </div>

            <div id="performance" class="page">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:25px; margin-bottom:25px;">
                    <div class="stat-card"><canvas id="chartProgresso"></canvas></div>
                    <div class="stat-card"><canvas id="chartXP"></canvas></div>
                </div>
                <div id="perf-table-container" class="stat-card"></div>
            </div>

            <div id="semanal" class="page">
                <div style="overflow-x:auto;"><div id="grid-semanal" class="grid-7"></div></div>
            </div>

            <div id="edital" class="page">
                <div class="stat-card">
                    <h3>Importar Edital</h3>
                    <input type="text" id="add-mat" placeholder="Nome da Matéria" style="margin-top:20px; width:100%; padding:15px; border-radius:12px; border:1px solid var(--border);">
                    <textarea id="add-ass" placeholder="Assuntos (um por linha)" style="margin-top:15px; width:100%; height:150px; padding:15px; border-radius:12px; border:1px solid var(--border);"></textarea>
                    <button class="btn btn-success" style="width:100%; margin-top:15px;" onclick="App.impEdital()">SALVAR EDITAL</button>
                </div>
            </div>

            <div id="sinalizar" class="page"><div id="tree"></div></div>
            <div id="ciclo" class="page"><div id="ciclo-lista" class="stat-card"></div></div>
        </div>
    </main>
    <script>
    const App = {
        state: {
            db: JSON.parse(localStorage.getItem('omni_v1.7.5_db')) || { 
                lista: [], metaFixa: {}, perf: {}, xp: 0, streak: 0, 
                xpHistory: {}, hMaster: 4, ciclo: [] 
            },
            activeDay: new Date().toISOString().split('T')[0],
            today: new Date().toISOString().split('T')[0],
            timers: {}
        },

        init() {
            this.renderDashboard();
            this.updateGamification();
            this.checkAtrasos();
            console.log("[SYSTEM] OMNI NEXUS v1.7.5 Operacional.");
        },

        save() { localStorage.setItem('omni_v1.7.5_db', JSON.stringify(this.state.db)); },

        checkAccess() {
            if(document.getElementById('pass-input').value === "123") {
                document.getElementById('login-screen').style.display='none';
                this.init();
            }
        },

        showTab(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(el) el.classList.add('active');
            if(id === 'semanal') this.renderSemanal();
            if(id === 'performance') this.renderPerformance();
            if(id === 'sinalizar') this.renderTree();
            if(id === 'ciclo') this.renderCiclo();
        },

        /* --- MOTOR DE GERAÇÃO COM RITO PEDAGÓGICO --- */
        getOrCreateDailyPlan(iso) {
            if (iso < this.state.today) return this.state.db.metaFixa[iso] || [];
            if (this.state.db.metaFixa[iso]) return this.state.db.metaFixa[iso];

            let pool = [];
            let hRestante = parseFloat(this.state.db.hMaster);
            const materias = this.state.db.ciclo.length ? this.state.db.ciclo : [...new Set(this.state.db.lista.map(x=>x.m))];

            materias.forEach(m => {
                if (hRestante <= 0) return;
                const pendente = this.state.db.lista.find(x => x.m === m && !x.f);
                if (pendente) {
                    let tipo = !pendente.e ? 'E' : (!pendente.r ? 'Rev' : 'Ex');
                    pool.push({ id: Math.random().toString(36).substr(2, 9), m: m, a: pendente.a, k: tipo, c: false, d: iso });
                    hRestante -= 1;
                }
            });
            this.state.db.metaFixa[iso] = pool;
            this.save();
            return pool;
        },

        renderDashboard() {
            const tasks = this.getOrCreateDailyPlan(this.state.activeDay);
            const container = document.getElementById('lista-diaria');
            const nextBtn = document.getElementById('next-day-container');
            document.getElementById('active-day-display').innerText = this.state.activeDay.split('-').reverse().slice(0,2).join('/');
            
            container.innerHTML = "";
            const allDone = tasks.length > 0 && tasks.every(t => t.c);
            nextBtn.innerHTML = allDone ? `<button class="btn btn-success" onclick="App.nextDay()">Adiantar matérias do dia seguinte <i class="fas fa-arrow-right"></i></button>` : "";

            tasks.forEach(t => {
                const col = t.k === 'Ex' ? 'ex' : (t.k === 'Rev' ? 'rev' : 'e');
                container.innerHTML += `
                    <div class="task-card" style="border-left-color: var(--color-${col}); ${t.c ? 'opacity:0.6' : ''}">
                        <div class="task-date-tag">${t.d}</div>
                        <span style="font-size:0.6rem; font-weight:800; color:var(--accent);">${t.k.toUpperCase()}</span>
                        <h3 style="margin:5px 0;">${t.m}</h3>
                        <p style="font-weight:600; color:var(--text-sec);">${t.a}</p>
                        <div class="timer-box">
                            <span id="tmr-${t.id}" style="font-weight:800;">00:00:00</span>
                            <button class="btn btn-outline" style="padding:5px 10px;" id="btn-tmr-${t.id}" onclick="App.toggleTimer('${t.id}')"><i class="fas fa-play"></i></button>
                            <input type="checkbox" ${t.c?'checked':''} onclick="App.toggleTask('${t.id}')" style="margin-left:auto; width:25px; height:25px;">
                        </div>
                    </div>`;
            });
            this.updateStats();
            this.loadExtraOptions();
        },

        toggleTimer(id) {
            const btn = document.getElementById(`btn-tmr-${id}`);
            if(this.state.timers[id]) {
                clearInterval(this.state.timers[id]);
                delete this.state.timers[id];
                btn.innerHTML = '<i class="fas fa-play"></i>';
            } else {
                btn.innerHTML = '<i class="fas fa-pause"></i>';
                let s = 0;
                this.state.timers[id] = setInterval(() => {
                    s++;
                    document.getElementById(`tmr-${id}`).innerText = new Date(s * 1000).toISOString().substr(11, 8);
                }, 1000);
            }
        },

        toggleTask(id) {
            const t = this.state.db.metaFixa[this.state.activeDay].find(x => x.id === id);
            t.c = !t.c;
            if(t.c) {
                const it = this.state.db.lista.find(x => x.m === t.m && x.a === t.a);
                if(it) {
                    if(t.k === 'E') it.e = true;
                    if(t.k === 'Rev') it.r = true;
                    if(t.k === 'Ex' || t.k === 'EXTRA') { it.x = true; it.f = true; }
                }
                this.addXP(50);
            }
            this.save(); this.renderDashboard();
        },

        renderSemanal() {
            const grid = document.getElementById('grid-semanal'); grid.innerHTML = "";
            for(let i=0; i<7; i++) {
                let d = new Date(this.state.today + "T12:00:00");
                d.setDate(d.getDate() + i);
                let iso = d.toISOString().split('T')[0];
                let tasks = this.getOrCreateDailyPlan(iso);
                grid.innerHTML += `<div class="day-column">
                    <div class="day-head ${iso===this.state.today?'today':''}">${iso.split('-').reverse().slice(0,2).join('/')}</div>
                    <div style="padding:10px;">${tasks.map(x=>`<div style="font-size:0.6rem; font-weight:800; background:#f8fafc; padding:8px; border-radius:8px; margin-bottom:5px; border-left:3px solid var(--accent);">${x.m}<br><small>${x.a}</small></div>`).join('')}</div>
                </div>`;
            }
        },

        addXP(v) { 
            this.state.db.xp += v; 
            this.state.db.xpHistory[this.state.today] = (this.state.db.xpHistory[this.state.today] || 0) + v;
            this.updateGamification(); 
        },

        updateGamification() {
            document.getElementById('xp-total').innerText = this.state.db.xp + " XP";
            document.getElementById('xp-fill').style.width = Math.min((this.state.db.xp/10000)*100, 100) + "%";
        },

        updateStats() {
            document.getElementById('d-xp-hoje').innerText = this.state.db.xpHistory[this.state.activeDay] || 0;
            document.getElementById('d-streak').innerText = this.state.db.streak;
            let h = 0; (this.state.db.metaFixa[this.state.activeDay] || []).forEach(t => { if(t.c) h++; });
            document.getElementById('d-h-total').innerText = h + "h";
        },

        checkAtrasos() {
            const atraso = Object.keys(this.state.db.metaFixa).some(d => d < this.state.today && this.state.db.metaFixa[d].some(t => !t.c));
            if(atraso) document.getElementById('replan-container').innerHTML = `<div class="replan-banner"><b>⚠️ ATRASOS DETECTADOS!</b> <button class="btn btn-success" onclick="App.replan()">REPLANEJAR</button></div>`;
        },

        replan() { this.state.db.metaFixa = {}; this.save(); location.reload(); },

        /* --- EXTRAS & CONFIGS --- */
        loadExtraOptions() {
            const mats = [...new Set(this.state.db.lista.map(x=>x.m))];
            document.getElementById('extra-mat').innerHTML = mats.map(m => `<option value="${m}">${m}</option>`).join('');
            this.loadExtraAssuntos();
        },
        loadExtraAssuntos() {
            const m = document.getElementById('extra-mat').value;
            document.getElementById('extra-ass').innerHTML = this.state.db.lista.filter(x=>x.m === m).map(x=>`<option value="${x.a}">${x.a}</option>`).join('');
        },
        createExtra() {
            const m = document.getElementById('extra-mat').value;
            const a = document.getElementById('extra-ass').value;
            this.state.db.metaFixa[this.state.activeDay].push({ id: "ex-"+Math.random(), m, a, k: 'EXTRA', c: false, d: this.state.activeDay });
            this.save(); this.renderDashboard();
        },

        impEdital() {
            const m = document.getElementById('add-mat').value;
            const ass = document.getElementById('add-ass').value.split('\n').filter(x=>x.trim());
            ass.forEach(a => { this.state.db.lista.push({ m, a: a.trim(), e:false, r:false, x:false, f:false }); });
            this.save(); alert("Importado!"); location.reload();
        },

        renderPerformance() {
            const ctxP = document.getElementById('chartProgresso').getContext('2d');
            const ctxX = document.getElementById('chartXP').getContext('2d');
            const mats = [...new Set(this.state.db.lista.map(x=>x.m))];
            const dataP = mats.map(m => (this.state.db.lista.filter(x=>x.m===m && x.f).length / this.state.db.lista.filter(x=>x.m===m).length * 100).toFixed(0));
            
            if(this.state.charts_p) this.state.charts_p.destroy();
            this.state.charts_p = new Chart(ctxP, { type: 'bar', data: { labels: mats, datasets: [{ label: '%', data: dataP, backgroundColor: '#0ea5e9' }] }, options: { indexAxis: 'y' } });
            
            const xpKeys = Object.keys(this.state.db.xpHistory).slice(-7);
            if(this.state.charts_x) this.state.charts_x.destroy();
            this.state.charts_x = new Chart(ctxX, { type: 'line', data: { labels: xpKeys, datasets: [{ label: 'XP', data: xpKeys.map(k=>this.state.db.xpHistory[k]), borderColor: '#fbbf24' }] } });
        },

        renderTree() {
            const tree = document.getElementById('tree');
            const mats = [...new Set(this.state.db.lista.map(x=>x.m))];
            tree.innerHTML = mats.map(m => `<div class="folder"><div class="folder-header" onclick="this.nextElementSibling.classList.toggle('active')">${m}</div><div class="folder-content">${this.state.db.lista.filter(x=>x.m===m).map(a => `<div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee;"><span>${a.a}</span><span>${a.f?'✅':'⏳'}</span></div>`).join('')}</div></div>`).join('');
        },

        renderCiclo() {
            const container = document.getElementById('ciclo-lista');
            const mats = [...new Set(this.state.db.lista.map(x=>x.m))];
            container.innerHTML = `<h3>Ordem do Ciclo</h3>` + mats.map(m => `<div style="margin-top:10px;"><input type="checkbox" ${this.state.db.ciclo.includes(m)?'checked':''} onchange="App.toggleCiclo('${m}')"> ${m}</div>`).join('');
        },
        toggleCiclo(m) { const idx = this.state.db.ciclo.indexOf(m); if(idx > -1) this.state.db.ciclo.splice(idx, 1); else this.state.db.ciclo.push(m); this.save(); },
        nextDay() { let d = new Date(this.state.activeDay + "T12:00:00"); d.setDate(d.getDate()+1); this.state.activeDay = d.toISOString().split('T')[0]; this.renderDashboard(); },
        toggleSub() { document.getElementById('sub-plano').classList.toggle('show'); }
    };
    </script>
</body>
</html>
