<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI NEXUS v.110 - ULTIMATE INTEGRITY</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a; --accent: #3b82f6; --bg: #f8fafc;
            --card-bg: #ffffff; --border: #e2e8f0; --text-main: #1e293b; --text-sec: #64748b;
            --color-e: linear-gradient(135deg, #3b82f6, #2563eb); 
            --color-rev: linear-gradient(135deg, #f59e0b, #d97706); 
            --color-ex: linear-gradient(135deg, #10b981, #059669);
            --radius-md: 20px; --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 280px; background: var(--primary); display: flex; flex-direction: column; padding: 30px 20px; border-right: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; overflow-y: auto; }
        .logo-box { padding-bottom: 40px; color: white; display: flex; align-items: center; gap: 15px; font-weight: 800; font-size: 1.4rem; letter-spacing: -1px; }
        .nav-item { padding: 14px 18px; color: #94a3b8; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 600; border-radius: 16px; transition: 0.3s; margin-bottom: 8px; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.06); color: white; }
        .nav-item.active { background: var(--accent); box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4); }
        .submenu { margin-left: 15px; border-left: 1px solid rgba(255,255,255,0.1); display: none; flex-direction: column; padding: 5px 0; }
        .submenu.show { display: flex; }
        .sub-link { padding: 10px 10px 10px 25px; color: #64748b; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
        .sub-link:hover { color: white; }

        .main { flex: 1; overflow-y: auto; padding: 40px; scroll-behavior: smooth; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 35px; }
        .stat-card { background: white; padding: 22px; border-radius: var(--radius-md); border: 1px solid var(--border); box-shadow: var(--shadow); position: relative; }
        .stat-card small { text-transform: uppercase; font-weight: 800; font-size: 0.65rem; color: var(--text-sec); letter-spacing: 1px; }
        .stat-val { font-size: 1.5rem; font-weight: 800; margin-top: 8px; color: var(--primary); }

        .task-card { background: white; border-radius: 18px; padding: 22px; margin-bottom: 15px; border: 1px solid var(--border); border-left: 10px solid #ccc; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .tag { font-size: 0.65rem; font-weight: 800; padding: 6px 14px; border-radius: 50px; color: white; margin-bottom: 8px; display: inline-block; }
        .tag-e { background: var(--color-e); } .tag-rev { background: var(--color-rev); } .tag-ex { background: var(--color-ex); }

        .grid-7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; min-width: 1100px; }
        .day-column { background: white; border: 1px solid var(--border); border-radius: 18px; min-height: 600px; display: flex; flex-direction: column; overflow: hidden; }
        .day-head { background: #f1f5f9; padding: 18px 10px; text-align: center; border-bottom: 1px solid var(--border); }
        .day-t { font-weight: 800; font-size: 0.7rem; color: var(--primary); text-transform: uppercase; }
        .sim-task { margin: 6px; padding: 10px; border-radius: 10px; font-size: 0.58rem; font-weight: 700; color: white; line-height: 1.3; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        .btn { padding: 14px 22px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
        input, textarea { padding: 14px 18px; border: 1px solid var(--border); border-radius: 14px; background: #f1f5f9; width: 100%; margin-top: 8px; font-family: inherit; }

        #login-screen { position: fixed; inset: 0; background: var(--primary); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 60px; border-radius: 35px; width: 420px; text-align: center; }
        .page { display: none; } .page.active { display: block; }
        input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); cursor: pointer; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-card">
            <h2 style="font-weight: 800; margin-bottom: 10px;">OMNI NEXUS v.110</h2>
            <input type="password" id="pass-input" placeholder="Sua Chave" style="text-align:center;">
            <button class="btn" style="width:100%; margin-top:25px;" onclick="checkAccess()">ENTRAR</button>
        </div>
    </div>

    <aside class="sidebar">
        <div class="logo-box"><i class="fas fa-microchip"></i> OMNI v.110</div>
        <div class="nav-item active" onclick="showTab('diaria', this)"><i class="fas fa-calendar-day"></i><span>Painel Hoje</span></div>
        <div class="nav-item" onclick="showTab('semanal', this)"><i class="fas fa-calendar-week"></i><span>Cronograma Semanal</span></div>
        <div class="nav-item" onclick="toggleSub()"><i class="fas fa-sliders"></i><span>Meu Plano</span><i class="fas fa-chevron-down" style="margin-left:auto;"></i></div>
        <div id="sub-plano" class="submenu">
            <div class="sub-link" onclick="showTab('edital')">Importar Edital</div>
            <div class="sub-link" onclick="showTab('ciclo')">Ciclo Ativo</div>
            <div class="sub-link" onclick="showTab('config-h')">Horas Diárias</div>
            <div class="sub-link" onclick="showTab('sinalizar')">Sinalizar Base</div>
        </div>
    </aside>

    <main class="main">
        <div class="container">
            <div class="stats-grid">
                <div class="stat-card"><small>Carga Pendente</small><div id="total-remaining-hrs" class="stat-val">0h</div></div>
                <div class="stat-card"><small>Estado do Sistema</small><div class="stat-val" style="color:var(--status-green)">ESTÁVEL</div></div>
                <div class="stat-card"><small>Sincronia IA</small><div class="stat-val">100%</div></div>
            </div>

            <div id="diaria" class="page active">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
                    <div id="btn-voltar-area" style="width:180px;"></div>
                    <div><h1 id="data-title" style="font-weight:800; text-align:center;">Hoje</h1><p id="meta-status" style="text-align:center;"></p></div>
                    <div id="btn-avancar-area" style="width:180px; text-align:right;">
                        <button class="btn btn-outline" onclick="navDay(1)">VER AMANHÃ <i class="fas fa-arrow-right"></i></button>
                    </div>
                </div>
                <div id="lista-diaria"></div>
            </div>

            <div id="semanal" class="page">
                <h1 style="margin-bottom:25px; font-weight:800;">Projeção de 7 Dias</h1>
                <div style="overflow-x:auto;"><div id="grid-semanal" class="grid-7"></div></div>
            </div>

            <div id="ciclo" class="page"><div id="checks-ciclo" class="stat-card" style="columns:2; padding:30px;"></div><button class="btn" style="width:100%; margin-top:20px;" onclick="saveC()">SALVAR CICLO</button></div>
            <div id="config-h" class="page"><div id="grid-horas-manual" style="display:flex; gap:10px; justify-content:center; padding:30px;"></div><button class="btn" style="width:100%;" onclick="saveH()">SALVAR HORAS</button></div>
            <div id="sinalizar" class="page"><div id="tree-container"></div></div>
            <div id="edital" class="page">
                <div class="stat-card" style="padding:30px;">
                    <input type="text" id="add-mat" placeholder="Ex: Direito Administrativo">
                    <textarea id="add-ass" placeholder="Assuntos (um por linha)..." style="height:150px; margin-top:15px;"></textarea>
                    <button class="btn" style="width:100%; margin-top:15px;" onclick="saveEdital()">IMPORTAR AGORA</button>
                </div>
            </div>
        </div>
    </main>
<script>
    /* ENGINE v.110 - ULTIMATE INTEGRITY LOGIC */
    let db = JSON.parse(localStorage.getItem('prf_v110')) || { 
        lista: [], ciclo: [], h: {1:4,2:4,3:4,4:4,5:4,6:4,0:4}, metaFixa: {} 
    };
    let currentViewDate = new Date();

    const save = () => localStorage.setItem('prf_v110', JSON.stringify(db));

    function checkAccess() { 
        if(document.getElementById('pass-input').value === "123") { 
            document.getElementById('login-screen').style.display='none'; 
            init(); 
        } 
    }

    function init() { 
        renderH(); 
        renderDiario(currentViewDate); 
        renderCiclo(); 
        updateStats(); 
    }

    function toggleSub() { document.getElementById('sub-plano').classList.toggle('show'); }

    function showTab(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active'); if(el) el.classList.add('active');
        if(id === 'semanal') renderSemanal();
        if(id === 'sinalizar') renderTree();
    }

    // MOTOR DE GERAÇÃO - RITO LINEAR (E -> Rev -> Ex)
    // simList é uma cópia da lista original para não afetar o banco real durante a simulação
    function getNeuralPool(limit, simList) {
        let pool = [];
        let somaH = 0;
        if(!db.ciclo.length) return pool;

        let safety = 0;
        while(somaH < limit && safety < 100) {
            safety++;
            let addedAny = false;

            for(let m of db.ciclo) {
                if(somaH >= limit) break;
                
                // Encontra o primeiro assunto da matéria que não foi finalizado no rito
                let it = simList.find(x => x.m === m && !x.f);
                if(!it) continue;

                const rito = [
                    {k:'E', l:'Estudo', h:1.5},
                    {k:'Rev', l:'Revisão', h:1},
                    {k:'Ex', l:'Exercícios', h:1}
                ];

                for(let s of rito) {
                    if(!it.done[s.k]) {
                        // Regra de Fragmentação: Apenas Estudo divide
                        if(s.k === 'E') {
                            let pendente = s.h - (it.hFeito || 0);
                            let disponivel = limit - somaH;
                            let alocar = Math.min(pendente, disponivel);
                            if(alocar > 0) {
                                pool.push({ m: it.m, a: it.a, label: s.l, key: s.k, hrs: alocar });
                                it.hFeito = (it.hFeito || 0) + alocar;
                                if(it.hFeito >= s.h - 0.01) it.done.E = true;
                                somaH += alocar; addedAny = true;
                            }
                        } else {
                            // Rev e Ex não dividem
                            if(somaH + s.h <= limit + 0.05) {
                                pool.push({ m: it.m, a: it.a, label: s.l, key: s.k, hrs: s.h });
                                it.done[s.k] = true;
                                somaH += s.h;
                                addedAny = true;
                                if(s.k === 'Ex') it.f = true;
                            }
                        }
                        break; // Trava a matéria para seguir o rito linear
                    }
                }
                if(addedAny) break; // Gira o ciclo para a próxima matéria
            }
            if(!addedAny) break;
        }
        return pool;
    }

    function renderDiario(date) {
        const hjK = new Date().toLocaleDateString();
        const curK = date.toLocaleDateString();
        const hM = parseFloat(db.h[date.getDay()]);
        
        document.getElementById('data-title').innerText = (hjK === curK) ? "Hoje" : curK;
        
        // Controle de botões Voltar/Avançar
        document.getElementById('btn-voltar-area').innerHTML = (hjK === curK) ? "" : 
            `<button class="btn btn-outline" onclick="navDay(0)"><i class="fas fa-history"></i> HOJE</button>`;

        // Se for hoje ou futuro e não tiver meta fixa, gera uma
        if(!db.metaFixa[curK]) {
            let simL = JSON.parse(JSON.stringify(db.lista));
            db.metaFixa[curK] = getNeuralPool(hM, simL);
            save();
        }

        const tasks = db.metaFixa[curK];
        document.getElementById('meta-status').innerText = `${tasks.reduce((a,b)=>a+b.hrs,0).toFixed(1)}h / ${hM}h meta`;
        
        document.getElementById('lista-diaria').innerHTML = tasks.map((t, i) => `
            <div class="task-card" style="border-left-color:var(--color-${t.key.toLowerCase().includes('rev')?'rev':t.key==='Ex'?'ex':'e'})">
                <div>
                    <span class="tag tag-${t.key.toLowerCase()}">${t.label} (${t.hrs < 1 ? (t.hrs*60)+'m' : t.hrs+'h'})</span>
                    <div style="font-weight:800; font-size:1.1rem;">${t.m}: ${t.a}</div>
                </div>
                <input type="checkbox" ${t.completed?'checked':''} onclick="concluirTask('${curK}', ${i})">
            </div>`).join('') || "<p style='text-align:center; padding:20px; color:gray;'>Nenhuma atividade para este dia. Ative o ciclo.</p>";
    }

    function navDay(dir) {
        if(dir === 0) currentViewDate = new Date();
        else currentViewDate.setDate(currentViewDate.getDate() + dir);
        renderDiario(currentViewDate);
    }

    function concluirTask(dateK, idx) {
        let t = db.metaFixa[dateK][idx];
        t.completed = !t.completed;
        
        let it = db.lista.find(x => x.m === t.m && x.a === t.a);
        if(it) {
            if(t.key === 'E') {
                it.hReal = (it.hReal || 0) + (t.completed ? t.hrs : -t.hrs);
                it.done.E = it.hReal >= 1.45;
            } else {
                it.done[t.key] = t.completed;
                if(t.key === 'Ex') it.f = t.completed;
            }
        }
        save();
        updateStats();
    }

    function renderSemanal() {
        const dias = ["DOM", "SEG", "TER", "QUA", "QUI", "SEX", "SÁB"];
        let virtualList = JSON.parse(JSON.stringify(db.lista));
        
        document.getElementById('grid-semanal').innerHTML = [0,1,2,3,4,5,6].map(off => {
            let d = new Date(); d.setDate(d.getDate() + off);
            let hL = parseFloat(db.h[d.getDay()]);
            
            // O segredo do semanal: ele gera as tarefas e ATUALIZA a virtualList para o dia seguinte
            let tasks = getNeuralPool(hL, virtualList);
            
            return `<div class="day-column">
                <div class="day-head"><div class="day-t">${dias[d.getDay()]} - ${d.getDate()}</div></div>
                ${tasks.map(x => `<div class="sim-task tag-${x.key.toLowerCase()}"><b>${x.m}</b><br>${x.a}</div>`).join('')}
            </div>`;
        }).join('');
    }

    function renderCiclo() {
        const mats = [...new Set(db.lista.map(x => x.m))];
        document.getElementById('checks-ciclo').innerHTML = mats.map(m => `
            <label style="display:flex; gap:10px; margin-bottom:12px; font-weight:700;">
                <input type="checkbox" class="ckc" value="${m}" ${db.ciclo.includes(m)?'checked':''}> ${m}
            </label>`).join('') || "Importe o edital primeiro.";
    }

    function saveC() {
        db.ciclo = Array.from(document.querySelectorAll('.ckc:checked')).map(c => c.value);
        db.metaFixa = {}; 
        save();
        init();
    }

    function renderH() {
        const d = ["DOM", "SEG", "TER", "QUA", "QUI", "SEX", "SÁB"];
        document.getElementById('grid-horas-manual').innerHTML = d.map((x,i) => `
            <div style="text-align:center;"><small style="font-weight:800;">${x}</small><br>
            <input type="number" id="h-in-${i}" value="${db.h[i]}" style="width:60px; text-align:center;"></div>`).join('');
    }

    function saveH() {
        [0,1,2,3,4,5,6].forEach(i => db.h[i] = document.getElementById(`h-in-${i}`).value);
        db.metaFixa = {};
        save();
        init();
    }

    function renderTree() {
        const mats = [...new Set(db.lista.map(x => x.m))];
        document.getElementById('tree-container').innerHTML = mats.map(m => {
            const ass = db.lista.filter(x => x.m === m);
            return `<div class="stat-card" style="margin-bottom:15px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <b>${m}</b>
                    <button class="btn btn-sm" onclick="toggleMateria('${m}')">Alternar Matéria</button>
                </div>
                <div style="margin-top:10px;">${ass.map(a => `
                    <div class="subject-row">
                        <span>${a.a}</span>
                        <input type="checkbox" ${a.done.E?'checked':''} onclick="toggleSubject('${a.m}','${a.a}')">
                    </div>`).join('')}
                </div>
            </div>`;
        }).join('');
    }

    function toggleMateria(m) {
        let matAssuntos = db.lista.filter(x => x.m === m);
        let target = !matAssuntos[0].done.E;
        matAssuntos.forEach(a => {
            a.done.E = target;
            if(target) { a.done.Rev = true; a.done.Ex = true; a.f = true; }
            else { a.done.Rev = false; a.done.Ex = false; a.f = false; a.hReal = 0; }
        });
        db.metaFixa = {}; save(); init(); renderTree();
    }

    function toggleSubject(m, a) {
        let it = db.lista.find(x => x.m === m && x.a === a);
        it.done.E = !it.done.E;
        if(!it.done.E) { it.done.Rev = false; it.done.Ex = false; it.f = false; it.hReal = 0; }
        db.metaFixa = {}; save(); init();
    }

    function saveEdital() {
        const m = document.getElementById('add-mat').value;
        const ass = document.getElementById('add-ass').value.split('\n').filter(l => l.trim().length > 2);
        ass.forEach(a => {
            if(!db.lista.some(x => x.m === m && x.a === a)) {
                db.lista.push({ m, a, f:false, done:{E:false,Rev:false,Ex:false}, hFeito:0, hReal:0 });
            }
        });
        document.getElementById('add-mat').value=""; 
        document.getElementById('add-ass').value="";
        save(); init();
    }

    function updateStats() {
        let total = db.lista.length * 3;
        let done = 0;
        db.lista.forEach(a => {
            if(a.done.E) done++; if(a.done.Rev) done++; if(a.done.Ex) done++;
        });
        let p = total > 0 ? (done/total)*100 : 0;
        document.getElementById('progress-perc').innerText = Math.round(p) + "%";
        document.getElementById('progress-fill').style.width = p + "%";
        document.getElementById('total-remaining-hrs').innerText = (total - done) + "h";
    }
</script>
</body>
</html>
