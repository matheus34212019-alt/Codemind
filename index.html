<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI NEXUS v.115 - REBORN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #0f172a; --accent: #3b82f6; --bg: #f8fafc;
            --card-bg: #ffffff; --border: #e2e8f0; --text-main: #1e293b; --text-sec: #64748b;
            --color-e: linear-gradient(135deg, #3b82f6, #2563eb); 
            --color-rev: linear-gradient(135deg, #f59e0b, #d97706); 
            --color-ex: linear-gradient(135deg, #10b981, #059669);
            --radius: 20px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR */
        .sidebar { width: 280px; background: var(--primary); padding: 30px 20px; display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; }
        .logo-box { color: white; font-weight: 800; font-size: 1.4rem; margin-bottom: 40px; display: flex; align-items: center; gap: 12px; }
        .nav-item { padding: 14px 18px; color: #94a3b8; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 600; border-radius: 16px; margin-bottom: 8px; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.06); color: white; }
        .nav-item.active { background: var(--accent); box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4); }
        
        .submenu { margin-left: 15px; border-left: 1px solid rgba(255,255,255,0.1); display: none; flex-direction: column; padding: 5px 0; }
        .submenu.show { display: flex; }
        .sub-link { padding: 10px 20px; color: #64748b; font-size: 0.85rem; cursor: pointer; }
        .sub-link:hover { color: white; }

        /* CONTENT */
        .main { flex: 1; overflow-y: auto; padding: 40px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .page { display: none; } .page.active { display: block; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 22px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .stat-card small { text-transform: uppercase; font-weight: 800; font-size: 0.65rem; color: var(--text-sec); letter-spacing: 1px; }
        .stat-val { font-size: 1.5rem; font-weight: 800; margin-top: 5px; color: var(--primary); }

        .task-card { background: white; border-radius: 18px; padding: 20px; margin-bottom: 12px; border: 1px solid var(--border); border-left: 10px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        .tag { font-size: 0.65rem; font-weight: 800; padding: 5px 12px; border-radius: 50px; color: white; display: inline-block; margin-bottom: 5px; }
        .tag-e { background: var(--color-e); } .tag-rev { background: var(--color-rev); } .tag-ex { background: var(--color-ex); }

        .grid-7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; min-width: 1000px; }
        .day-column { background: white; border-radius: 15px; border: 1px solid var(--border); min-height: 500px; overflow: hidden; }
        .day-head { background: #f1f5f9; padding: 12px; text-align: center; border-bottom: 1px solid var(--border); font-weight: 800; font-size: 0.75rem; }
        .sim-task { margin: 5px; padding: 8px; border-radius: 8px; font-size: 0.6rem; color: white; font-weight: 700; line-height: 1.2; }

        .folder { background: white; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 10px; overflow: hidden; }
        .folder-header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: #f8fafc; }
        .folder-content { display: none; padding: 10px; border-top: 1px solid var(--border); }
        .folder-content.open { display: block; }

        .btn { padding: 12px 20px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
        input, select, textarea { padding: 12px; border-radius: 12px; border: 1px solid var(--border); width: 100%; margin-top: 8px; font-family: inherit; background: #f1f5f9; }
        
        #login-screen { position: fixed; inset: 0; background: var(--primary); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 50px; border-radius: 30px; width: 380px; text-align: center; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-card">
            <h2 style="margin-bottom:20px; font-weight:800;">OMNI v.115</h2>
            <input type="password" id="pass-input" placeholder="Sua Chave" style="text-align:center;">
            <button class="btn" style="width:100%; margin-top:20px;" onclick="checkAccess()">ENTRAR</button>
        </div>
    </div>

    <aside class="sidebar">
        <div class="logo-box"><i class="fas fa-shield-halved"></i> OMNI NEXUS</div>
        <div class="nav-item active" onclick="showTab('diaria', this)"><i class="fas fa-calendar-day"></i><span>Painel Hoje</span></div>
        <div class="nav-item" onclick="showTab('performance', this)"><i class="fas fa-chart-line"></i><span>Performance</span></div>
        <div class="nav-item" onclick="showTab('semanal', this)"><i class="fas fa-calendar-week"></i><span>Cronograma Semanal</span></div>
        <div class="nav-item" onclick="toggleSub()"><i class="fas fa-bars-staggered"></i><span>Meu Plano</span><i class="fas fa-chevron-down" style="margin-left:auto;"></i></div>
        <div id="sub-plano" class="submenu">
            <div class="sub-link" onclick="showTab('edital')">Importar Edital</div>
            <div class="sub-link" onclick="showTab('ciclo')">Ciclo Ativo</div>
            <div class="sub-link" onclick="showTab('config-h')">Horas Diárias</div>
            <div class="sub-link" onclick="showTab('sinalizar')">Sinalizar Base</div>
            <div class="sub-link" onclick="showTab('fluxo')">Ajustar Fluxos</div>
        </div>
    </aside>

    <main class="main">
        <div class="container">
            <div class="stats-grid">
                <div class="stat-card"><small>Carga Restante</small><div id="stat-h" class="stat-val">0h</div></div>
                <div class="stat-card"><small>Precisão Geral</small><div id="stat-p" class="stat-val">0%</div></div>
                <div class="stat-card"><small>Sincronia</small><div class="stat-val" style="color:var(--accent)">100%</div></div>
            </div>

            <div id="diaria" class="page active">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
                    <div id="nav-l" style="width:150px;"></div>
                    <h1 id="view-title" style="font-weight:800;">Hoje</h1>
                    <div id="nav-r" style="width:150px; text-align:right;">
                        <button class="btn btn-outline btn-sm" onclick="nav(1)">VER AMANHÃ <i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
                <div id="lista-diaria"></div>
            </div>

            <div id="semanal" class="page">
                <h1 style="margin-bottom:20px;">Projeção de 7 Dias</h1>
                <div style="overflow-x:auto;"><div id="grid-semanal" class="grid-7"></div></div>
            </div>

            <div id="edital" class="page">
                <div class="stat-card">
                    <input type="text" id="add-mat" placeholder="Matéria">
                    <select id="h-def" style="margin-top:10px;"><option value="0.5">30m</option><option value="1">60m</option><option value="1.5" selected>90m</option><option value="2">2h</option></select>
                    <textarea id="add-ass" placeholder="Assuntos (um por linha)..." style="height:150px; margin-top:10px;"></textarea>
                    <button class="btn" style="width:100%; margin-top:15px;" onclick="impEdital()">IMPORTAR</button>
                </div>
            </div>
            
            <div id="config-h" class="page"><div id="grid-h-in" style="display:flex; gap:10px; justify-content:center; padding:20px;"></div><button class="btn" style="width:100%;" onclick="saveH()">SALVAR CARGA</button></div>
            <div id="ciclo" class="page"><div id="check-c" class="stat-card" style="columns:2;"></div><button class="btn" style="width:100%; margin-top:20px;" onclick="saveC()">ATIVAR CICLO</button></div>
            <div id="sinalizar" class="page"><div id="tree"></div></div>
            <div id="fluxo" class="page"><div id="fluxo-content"></div></div>
            <div id="performance" class="page"><div class="stats-grid"><div class="stat-card"><canvas id="c1"></canvas></div><div class="stat-card"><canvas id="c2"></canvas></div></div></div>
        </div>
    </main>
<script>
    /* ENGINE v.115 - THE REBORN CORE */
    let db = JSON.parse(localStorage.getItem('prf_v115')) || { 
        lista: [], ciclo: [], h: {1:4,2:4,3:4,4:4,5:4,6:4,0:4}, metaFixa: {} 
    };
    let vDate = new Date();

    const save = () => localStorage.setItem('prf_v115', JSON.stringify(db));
    const formatT = (h) => h === 0.5 ? "30m" : h === 1 ? "60m" : h === 1.5 ? "90m" : h === 2 ? "2h" : (h*60)+"m";

    function checkAccess() { 
        if(document.getElementById('pass-input').value === "123") { 
            document.getElementById('login-screen').style.display='none'; init(); 
        } 
    }

    function init() { renderH(); renderDiario(vDate); renderCiclo(); updateStats(); }

    function showTab(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active'); if(el) el.classList.add('active');
        if(id === 'semanal') renderSemanal();
        if(id === 'sinalizar') renderTree();
        if(id === 'fluxo') renderFluxo();
    }

    function toggleSub() { document.getElementById('sub-plano').classList.toggle('show'); }

    // --- MOTOR DE SIMULAÇÃO (RITO LINEAR) ---
    function getNeuralPool(limit, simList) {
        let pool = []; let somaH = 0;
        if(!db.ciclo.length) return pool;
        let safety = 0;
        while(somaH < limit && safety < 100) {
            safety++; let added = false;
            for(let m of db.ciclo) {
                if(somaH >= limit) break;
                let it = simList.find(x => x.m === m && !x.f);
                if(!it) continue;
                const rito = [{k:'E', l:'Estudo', h:it.hE||1.5}, {k:'Rev', l:'Revisão', h:1}, {k:'Ex', l:'Exercícios', h:1}];
                for(let s of rito) {
                    if(!it.done[s.k]) {
                        if(s.k === 'E') {
                            let p = s.h - (it.hF || 0); let alocar = Math.min(p, limit - somaH);
                            if(alocar > 0) {
                                pool.push({ m: it.m, a: it.a, label: s.l, key: s.k, hrs: alocar });
                                it.hF = (it.hF || 0) + alocar; if(it.hF >= s.h - 0.01) it.done.E = true;
                                somaH += alocar; added = true;
                            }
                        } else if(somaH + s.h <= limit + 0.01) {
                            pool.push({ m: it.m, a: it.a, label: s.l, key: s.k, hrs: s.h });
                            it.done[s.k] = true; somaH += s.h; added = true; if(s.k === 'Ex') it.f = true;
                        }
                        break;
                    }
                }
                if(added) break;
            }
            if(!added) break;
        } return pool;
    }

    // --- PAINEL DIÁRIO ---
    function renderDiario(date) {
        const hj = new Date().toLocaleDateString(); const cur = date.toLocaleDateString();
        const hM = parseFloat(db.h[date.getDay()]);
        document.getElementById('view-title').innerText = hj === cur ? "Hoje" : cur;
        document.getElementById('nav-l').innerHTML = hj === cur ? "" : `<button class="btn btn-outline btn-sm" onclick="nav(0)">VOLTAR HOJE</button>`;
        
        if(!db.metaFixa[cur] || date > new Date()) {
            let simL = JSON.parse(JSON.stringify(db.lista));
            db.metaFixa[cur] = getNeuralPool(hM, simL);
        }
        const tasks = db.metaFixa[cur];
        document.getElementById('meta-status').innerText = `${tasks.reduce((a,b)=>a+b.hrs,0).toFixed(1)}h / ${hM}h meta`;
        document.getElementById('lista-diaria').innerHTML = tasks.map((t, i) => `
            <div class="task-card" style="border-left-color:var(--color-${t.key.toLowerCase().includes('rev')?'rev':t.key==='Ex'?'ex':'e'})">
                <div><span class="tag tag-${t.key.toLowerCase()}">${t.label} (${formatT(t.hrs)})</span><div style="font-weight:800;">${t.m}: ${t.a}</div></div>
                <input type="checkbox" ${t.c?'checked':''} onclick="concluir('${cur}', ${i})">
            </div>`).join('') || "<p style='text-align:center;'>Configure o ciclo.</p>";
    }

    function nav(dir) { if(dir === 0) vDate = new Date(); else vDate.setDate(vDate.getDate() + dir); renderDiario(vDate); }

    function concluir(dK, idx) {
        let t = db.metaFixa[dK][idx]; t.c = !t.c;
        let it = db.lista.find(x => x.m === t.m && x.a === t.a);
        if(t.key === 'E') { it.hF = (it.hF || 0) + (t.c ? t.hrs : -t.hrs); it.done.E = it.hF >= (it.hE - 0.1); }
        else { it.done[t.key] = t.c; if(t.key === 'Ex') it.f = t.c; }
        save(); updateStats();
    }

    // --- CRONOGRAMA 7 DIAS ---
    function renderSemanal() {
        let virtual = JSON.parse(JSON.stringify(db.lista));
        const dias = ["DOM", "SEG", "TER", "QUA", "QUI", "SEX", "SÁB"];
        document.getElementById('grid-semanal').innerHTML = [0,1,2,3,4,5,6].map(off => {
            let d = new Date(); d.setDate(d.getDate() + off);
            let tasks = getNeuralPool(db.h[d.getDay()], virtual);
            return `<div class="day-column"><div class="day-head">${dias[d.getDay()]} - ${d.getDate()}</div>
            ${tasks.map(x => `<div class="sim-task tag-${x.key.toLowerCase()}"><b>${x.m}</b><br>${x.a}</div>`).join('')}</div>`;
        }).join('');
    }

    // --- CONFIGURAÇÕES ---
    function impEdital() {
        const m = document.getElementById('add-mat').value; const hE = parseFloat(document.getElementById('h-def').value);
        const ass = document.getElementById('add-ass').value.split('\n').filter(l => l.trim().length > 2);
        ass.forEach(a => db.lista.push({ m, a: a.trim(), hE, f:false, done:{E:false,Rev:false,Ex:false}, hF:0 }));
        save(); init(); alert("Importado!");
    }

    function renderTree() {
        const mats = [...new Set(db.lista.map(x => x.m))];
        document.getElementById('tree').innerHTML = mats.map(m => `
            <div class="folder"><div class="folder-header" onclick="this.nextElementSibling.classList.toggle('open')"><b>${m}</b> 
            <button class="btn btn-sm btn-outline" onclick="event.stopPropagation(); bM('${m}', true)">Marcar Tudo</button></div>
            <div class="folder-content">${db.lista.filter(x => x.m === m).map(a => `<div style="display:flex; justify-content:space-between; padding:8px;">${a.a} <input type="checkbox" ${a.done.E?'checked':''} onclick="tA('${a.m}','${a.a}')"></div>`).join('')}</div></div>
        `).join('');
    }
    function bM(m, v) { db.lista.filter(x => x.m === m).forEach(a => { a.done.E = v; a.done.Rev = v; a.done.Ex = v; a.f = v; a.hF = v ? a.hE : 0; }); db.metaFixa = {}; save(); init(); renderTree(); }
    function tA(m, a) { let it = db.lista.find(x => x.m === m && x.a === a); it.done.E = !it.done.E; if(!it.done.E) { it.done.Rev=false; it.done.Ex=false; it.f=false; it.hF=0; } db.metaFixa={}; save(); init(); }

    function renderH() { const d = ["DOM", "SEG", "TER", "QUA", "QUI", "SEX", "SÁB"]; document.getElementById('grid-h-in').innerHTML = d.map((x,i) => `<div><small>${x}</small><br><input type="number" id="h-${i}" value="${db.h[i]}" style="width:50px;"></div>`).join(''); }
    function saveH() { [0,1,2,3,4,5,6].forEach(i => db.h[i] = document.getElementById(`h-${i}`).value); db.metaFixa = {}; save(); init(); }
    function renderCiclo() { const mats = [...new Set(db.lista.map(x => x.m))]; document.getElementById('check-c').innerHTML = mats.map(m => `<label style="display:block;"><input type="checkbox" class="ckc" value="${m}" ${db.ciclo.includes(m)?'checked':''}> ${m}</label>`).join(''); }
    function saveC() { db.ciclo = Array.from(document.querySelectorAll('.ckc:checked')).map(c => c.value); db.metaFixa = {}; save(); init(); }
    function renderFluxo() { document.getElementById('fluxo-content').innerHTML = db.lista.map((it, i) => `<div class="stat-card" style="margin-bottom:10px;"><b>${it.m}: ${it.a}</b><input type="number" value="${it.hE}" onchange="db.lista[${i}].hE=this.value;save()"></div>`).join(''); }
    function updateStats() {
        let t = db.lista.length * 3; let d = 0; db.lista.forEach(a => { if(a.done.E) d++; if(a.done.Rev) d++; if(a.done.Ex) d++; });
        document.getElementById('stat-h').innerText = Math.round((t - d) * 1.5) + "h";
        document.getElementById('stat-p').innerText = Math.round((d/t)*100 || 0) + "%";
    }
</script>
</body>
</html>
