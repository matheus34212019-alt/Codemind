<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI NEXUS - Importar Edital</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #ffffff;
            --primary-green: #10b981;
            --text-main: #334155;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container-edital {
            background: var(--card-bg);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            color: var(--text-main);
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input[type="text"], textarea, input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s;
        }

        input:focus, textarea:focus {
            border-color: var(--primary-green);
        }

        .time-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .time-field label {
            display: block;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .btn-salvar {
            background-color: var(--primary-green);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-salvar:hover {
            background-color: #059669;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }
    </style>
</head>
<body>

<div class="container-edital">
    <h2>Importar Edital</h2>

    <div class="input-group">
        <input type="text" id="nomeMateria" placeholder="Nome da Matéria">
    </div>

    <div class="input-group">
        <textarea id="assuntosArea" placeholder="Assuntos (um por linha)"></textarea>
    </div>

    <div class="time-row">
        <div class="time-field">
            <label>TEMPO ESTUDO (MIN)</label>
            <input type="number" id="tempoEstudo" placeholder="Ex: 60" min="0">
        </div>
        <div class="time-field">
            <label>TEMPO REVISÃO (MIN)</label>
            <input type="number" id="tempoRevisao" placeholder="Ex: 20" min="0">
        </div>
        <div class="time-field">
            <label>TEMPO EXERCÍCIO (MIN)</label>
            <input type="number" id="tempoExercicio" placeholder="Ex: 30" min="0">
        </div>
    </div>

    <button class="btn-salvar" onclick="salvarNoBanco()">Salvar no Banco</button>
</div>

<script>
    function salvarNoBanco() {
        const materia = document.getElementById('nomeMateria').value;
        const assuntosRaw = document.getElementById('assuntosArea').value;
        const tEstudo = document.getElementById('tempoEstudo').value;
        const tRevisao = document.getElementById('tempoRevisao').value;
        const tExercicio = document.getElementById('tempoExercicio').value;

        if (!materia || !assuntosRaw) {
            alert("Por favor, preencha a matéria e os assuntos.");
            return;
        }

        const listaAssuntos = assuntosRaw.split('\n').filter(a => a.trim() !== "");

        // Objeto formatado com as novas métricas de tempo
        const novoEdital = {
            id: Date.now(),
            materia: materia,
            assuntos: listaAssuntos,
            configuracaoTempo: {
                estudo: parseInt(tEstudo) || 0,
                revisao: parseInt(tRevisao) || 0,
                exercicio: parseInt(tExercicio) || 0
            },
            dataCriacao: new Date().toLocaleDateString()
        };

        // Persistência no LocalStorage (Simulando Banco)
        let banco = JSON.parse(localStorage.getItem('omni_editais')) || [];
        banco.push(novoEdital);
        localStorage.setItem('omni_editais', JSON.stringify(banco));

        alert("Matéria e metas de tempo salvas com sucesso!");
        
        // Limpar campos
        document.getElementById('nomeMateria').value = '';
        document.getElementById('assuntosArea').value = '';
        document.getElementById('tempoEstudo').value = '';
        document.getElementById('tempoRevisao').value = '';
        document.getElementById('tempoExercicio').value = '';
    }
</script>

</body>
</html>
