<!DOCTYPE html><html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMNI COMMAND v.56 - SMART</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body{font-family:Arial;background:#f8fafc;margin:0;display:flex}
.sidebar{width:250px;background:#0f172a;color:#fff;height:100vh;padding:20px}
.main{flex:1;padding:20px}
.card{background:#fff;padding:15px;margin-bottom:10px;border-radius:10px}
.btn{padding:10px;background:#3b82f6;color:#fff;border:none;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<div class="sidebar">
<h2>OMNI SMART</h2>
<button class="btn" onclick="gerarDia()">Gerar Dia</button>
</div>
<div class="main">
<h1>Painel Inteligente</h1>
<div id="lista"></div>
</div><script>
let db = JSON.parse(localStorage.getItem('omni_v56')) || {
 lista: [],
 h: {0:4,1:4,2:4,3:4,4:4,5:4,6:4}
};

function save(){localStorage.setItem('omni_v56', JSON.stringify(db));}

function garantirCampos(){
 db.lista.forEach(i=>{
  if(i.nivel===undefined) i.nivel=0;
  if(i.ultima===undefined) i.ultima=0;
 });
}

function prioridade(i){
 const dias = (Date.now()-i.ultima)/(1000*60*60*24);
 return (5-i.nivel) + dias;
}

function gerarDia(){
 garantirCampos();
 const hoje = new Date().getDay();
 const meta = db.h[hoje] || 4;

 const ordenado = [...db.lista].sort((a,b)=>prioridade(b)-prioridade(a));
 
 let horas=0;
 let selecionados=[];

 for(let i of ordenado){
  const carga = parseFloat(i.h?.E || 1);
  selecionados.push({...i, hrs:carga});
  horas += carga;
  if(horas>=meta) break;
 }

 render(selecionados, meta, horas);
}

function render(lista, meta, total){
 document.getElementById('lista').innerHTML = `<b>${total}h / ${meta}h</b>` + lista.map(i=>`
 <div class="card">
  <b>${i.m}</b><br>
  ${i.a}<br>
  Nível: ${i.nivel}<br>
  <button onclick="concluir('${i.m}','${i.a}')">Concluir</button>
 </div>
 `).join('');
}

function concluir(m,a){
 const it = db.lista.find(x=>x.m===m && x.a===a);
 if(!it) return;
 it.nivel = Math.min(it.nivel+1,5);
 it.ultima = Date.now();
 save();
 gerarDia();
}

</script></body>
</html>
