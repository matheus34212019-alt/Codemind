<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI COMMAND v.47 - PRF MATHEUS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a; --accent: #3b82f6; --bg: #f8fafc;
            --border: #e2e8f0; --text-main: #1e293b; --text-sec: #64748b;
            --color-e: #3b82f6; --color-res: #8b5cf6; --color-rev: #f59e0b; --color-ex: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 280px; background: var(--primary); display: flex; flex-direction: column; flex-shrink: 0; height: 100vh; overflow-y: auto; }
        .logo-box { padding: 30px; color: white; display: flex; align-items: center; gap: 10px; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .nav-item { padding: 15px 30px; color: #94a3b8; cursor: pointer; display: flex; align-items: center; gap: 15px; font-weight: 600; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: #1e293b; color: white; }
        
        .submenu { background: rgba(0,0,0,0.2); display: none; flex-direction: column; }
        .submenu.show { display: flex; }
        .sub-link { padding: 12px 30px 12px 70px; color: #64748b; font-size: 0.85rem; cursor: pointer; font-weight: 500; }
        .sub-link:hover { color: white; }

        .main { flex: 1; height: 100vh; overflow-y: auto; padding: 45px; -webkit-overflow-scrolling: touch; }
        .container { max-width: 1100px; margin: 0 auto; }

        /* TABELA DE FLUXO */
        .flow-card { background: white; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 15px; padding: 20px; }
        .flow-header-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr; gap: 10px; margin-top: 15px; align-items: center; }
        .flow-input-group { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .flow-input-group input[type="number"] { width: 60px; padding: 5px; text-align: center; border-radius: 5px; border: 1px solid var(--border); }
        
        .task-card { background: white; border-radius: 18px; padding: 25px; margin-bottom: 15px; border: 1px solid var(--border); border-left: 12px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        .tag { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; padding: 5px 10px; border-radius: 6px; color: white; }
        
        .btn { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 15px; }
        #login-screen { position: fixed; inset: 0; background: var(--primary); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 50px; border-radius: 35px; width: 420px; text-align: center; }
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h1>🚓</h1>
            <input type="password" id="pass-input" placeholder="Senha" style="width:100%; padding:14px; margin-top:20px; text-align:center;">
            <button class="btn" onclick="checkAccess()">ENTRAR</button>
        </div>
    </div>

    <aside class="sidebar">
        <div class="logo-box">OMNI COMMAND</div>
        <div class="nav-item active" onclick="showTab('diaria', this)"><i class="fas fa-house"></i><span>Painel Diário</span></div>
        <div class="nav-item" onclick="toggleSub()"><i class="fas fa-folder-open"></i><span>Meu Plano</span><i class="fas fa-chevron-down" style="margin-left:auto; font-size:0.7rem;"></i></div>
        <div id="sub-plano" class="submenu">
            <div class="sub-link" onclick="showTab('edital')">Edital Verticalizado</div>
            <div class="sub-link" onclick="showTab('sinalizar')">Sinalizar Estudados</div>
            <div class="sub-link" onclick="showTab('fluxo')">Controle de Fluxo</div>
            <div class="sub-link" onclick="showTab('ciclo')">Ciclo Ativo</div>
        </div>
    </aside>

    <main class="main">
        <div class="container">
            <div id="diaria" class="page active"><h1>Meta Diária 🚓</h1><div id="lista-diaria" style="margin-top:20px;"></div></div>

            <div id="fluxo" class="page">
                <h1>Controle de Fluxo Inteligente</h1>
                <p style="color:var(--text-sec); margin: 10px 0 25px 0;">Ative as etapas e defina as horas para cada assunto.</p>
                <div id="corpo-fluxo"></div>
            </div>

            <div id="edital" class="page">
                <h1>Cadastrar Edital</h1>
                <div class="flow-card" style="padding:30px;">
                    <input type="text" id="add-mat" placeholder="Matéria" style="width:100%; padding:15px; margin-bottom:15px; border-radius:10px; border:1px solid var(--border);">
                    <textarea id="add-ass" placeholder="Assuntos (um por linha)" style="width:100%; height:120px; padding:15px; border-radius:10px; border:1px solid var(--border);"></textarea>
                    <button class="btn" onclick="saveEdital()">SALVAR NO BANCO</button>
                </div>
            </div>

            <div id="sinalizar" class="page"><h1>Sinalizar Bagagem</h1><div id="tree-container" style="margin-top:20px;"></div></div>
            <div id="ciclo" class="page"><h1>Ciclo Ativo</h1><div id="checks-ciclo" class="flow-card" style="columns:2;"></div><button class="btn" onclick="saveC()">ATUALIZAR CICLO</button></div>
        </div>
    </main>

<script>
    let db = JSON.parse(localStorage.getItem('prf_v47')) || { 
        lista: [], ciclo: [], pass: "123" 
    };

    function save() { localStorage.setItem('prf_v47', JSON.stringify(db)); }

    function checkAccess() {
        if(document.getElementById('pass-input').value === db.pass || document.getElementById('pass-input').value === "123") {
            document.getElementById('login-screen').style.display='none'; init();
        } else alert("Senha Incorreta!");
    }

    function init() { renderDiario(); renderFluxo(); }
    function toggleSub() { document.getElementById('sub-plano').classList.toggle('show'); }

    function showTab(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(m => m.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(el && el.classList.contains('nav-item')) el.classList.add('active');
        if(id === 'fluxo') renderFluxo();
        if(id === 'diaria') renderDiario();
        if(id === 'sinalizar') renderTree();
        if(id === 'ciclo') renderCiclo();
    }

    // --- CONTROLE DE FLUXO (O QUE VOCÊ PEDIU) ---
    function renderFluxo() {
        document.getElementById('corpo-fluxo').innerHTML = db.lista.map((it, i) => `
            <div class="flow-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <b style="font-size:1.1rem; color:var(--primary)">${it.m}</b>
                    <span style="color:var(--text-sec); font-size:0.9rem;">${it.a}</span>
                </div>
                <div class="flow-header-row">
                    <div style="font-size:0.8rem; font-weight:700; color:var(--text-sec)">ETAPAS:</div>
                    <div class="flow-input-group">
                        <small>Estudo</small>
                        <input type="checkbox" onchange="db.lista[${i}].act.E=this.checked;save()" ${it.act.E?'checked':''}>
                        <input type="number" step="0.5" value="${it.h.E}" onchange="db.lista[${i}].h.E=this.value;save()">
                    </div>
                    <div class="flow-input-group">
                        <small>Resumo</small>
                        <input type="checkbox" onchange="db.lista[${i}].act.Res=this.checked;save()" ${it.act.Res?'checked':''}>
                        <input type="number" step="0.5" value="${it.h.Res}" onchange="db.lista[${i}].h.Res=this.value;save()">
                    </div>
                    <div class="flow-input-group">
                        <small>Revisão</small>
                        <input type="checkbox" onchange="db.lista[${i}].act.Rev=this.checked;save()" ${it.act.Rev?'checked':''}>
                        <input type="number" step="0.5" value="${it.h.Rev}" onchange="db.lista[${i}].h.Rev=this.value;save()">
                    </div>
                    <div class="flow-input-group">
                        <small>Exercícios</small>
                        <input type="checkbox" onchange="db.lista[${i}].act.Ex=this.checked;save()" ${it.act.Ex?'checked':''}>
                        <input type="number" step="0.5" value="${it.h.Ex}" onchange="db.lista[${i}].h.Ex=this.value;save()">
                    </div>
                </div>
            </div>
        `).join('') || "<p>Cadastre matérias no edital.</p>";
    }

    function getPool() {
        let pool = [];
        db.lista.filter(x => db.ciclo.includes(x.m) && !x.f).forEach(x => {
            const rito = [
                {k:'E', l:'Estudo', c:'var(--color-e)', h: x.h.E}, 
                {k:'Res', l:'Resumo', c:'var(--color-res)', h: x.h.Res}, 
                {k:'Rev', l:'Revisão', c:'var(--color-rev)', h: x.h.Rev}, 
                {k:'Ex', l:'Exercícios', c:'var(--color-ex)', h: x.h.Ex}
            ];
            for(let s of rito) {
                if(x.act[s.k] && !x.done[s.k]) {
                    pool.push({ m: x.m, a: x.a, label: s.l, color: s.c, key: s.k, hrs: s.h });
                    break;
                }
            }
        });
        return pool;
    }

    function renderDiario() {
        const p = getPool();
        let meta = []; let mSet = new Set();
        for(let t of p) { if(!mSet.has(t.m) && meta.length < 3) { meta.push(t); mSet.add(t.m); } }
        document.getElementById('lista-diaria').innerHTML = meta.map(t => `
            <div class="task-card" style="border-left-color:${t.color}">
                <div>
                    <span class="tag" style="background:${t.color}">${t.label} (${t.hrs}h)</span>
                    <div style="font-weight:800; font-size:1.2rem; margin-top:8px;">${t.m}: ${t.a}</div>
                </div>
                <input type="checkbox" style="width:30px; height:30px;" onclick="concluirStep('${t.m}','${t.a}','${t.key}')">
            </div>
        `).join('');
    }

    function concluirStep(m, a, k) {
        const it = db.lista.find(x => x.m === m && x.a === a);
        it.done[k] = true; if(it.done.Ex || !it.act.Ex && it.done.Rev) it.f = true;
        save(); setTimeout(renderDiario, 300);
    }

    function saveEdital() {
        const m = document.getElementById('add-mat').value;
        const ass = document.getElementById('add-ass').value.split('\n').filter(l => l.trim());
        ass.forEach(a => db.lista.push({ 
            m, a: a.trim(), f: false, 
            act: {E:true, Res:true, Rev:true, Ex:true}, 
            done: {E:false, Res:false, Rev:false, Ex:false},
            h: {E:2, Res:0.5, Rev:0.5, Ex:1} // Horas padrão
        }));
        document.getElementById('add-mat').value = ""; document.getElementById('add-ass').value = "";
        save(); alert("Matéria Salva! Vá em 'Controle de Fluxo' para ajustar as horas.");
    }

    function renderTree() {
        const mats = [...new Set(db.lista.map(x => x.m))];
        document.getElementById('tree-container').innerHTML = mats.map(m => {
            const ass = db.lista.filter(x => x.m === m);
            return `<div class="flow-card"><div style="font-weight:700; margin-bottom:10px;">${m}</div>${ass.map(a => `<div style="padding:8px; border-bottom:1px solid #eee; display:flex; justify-content:space-between;"><span>${a.a}</span><input type="checkbox" onchange="toggleV('${m}','${a.a}',this.checked)" ${a.done.E?'checked':''}></div>`).join('')}</div>`;
        }).join('');
    }
    function toggleV(m, a, v) { const it = db.lista.find(x => x.m === m && x.a === a); it.done.E = v; if(v) it.done.Res = v; save(); }
    function renderCiclo() {
        const m = [...new Set(db.lista.map(x => x.m))];
        document.getElementById('checks-ciclo').innerHTML = m.map(x => `<label style="display:block; padding:10px;"><input type="checkbox" class="ckc" value="${x}" ${db.ciclo.includes(x)?'checked':''}> ${x}</label>`).join('');
    }
    function saveC() { db.ciclo = Array.from(document.querySelectorAll('.ckc:checked')).map(c => c.value); save(); renderDiario(); alert("Ciclo salvo!"); }
</script>
</body>
</html>
