<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMNI NEXUS v.120 - FULL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg: #f1f5f9;
            --text-main: #1e293b;
            --text-sec: #64748b;
            --color-e: #22c55e;
            --color-rev: #eab308;
            --color-ex: #ef4444;
            --border: #e2e8f0;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body { display: flex; height: 100vh; background: var(--bg); color: var(--text-main); overflow: hidden; }

        /* COMPONENTES */
        .btn { padding: 14px 22px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text-main); }
        .btn-sm { padding: 8px 14px; font-size: 0.75rem; }
        input, select, textarea { padding: 14px 18px; border: 1px solid var(--border); border-radius: 14px; background: white; }
        input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); cursor: pointer; margin: 0; }

        #login-screen { position: fixed; inset: 0; background: var(--primary); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 60px; border-radius: 35px; width: 420px; text-align: center; }

        .sidebar { width: 300px; background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 100; transition: 0.3s; }
        .logo-box { padding: 40px 30px; font-weight: 900; font-size: 1.3rem; color: var(--accent); display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
        .nav-content { flex: 1; padding: 25px; overflow-y: auto; }
        .nav-item { padding: 16px 20px; border-radius: 15px; display: flex; align-items: center; gap: 15px; cursor: pointer; color: var(--text-sec); font-weight: 600; margin-bottom: 10px; transition: 0.2s; }
        .nav-item:hover { background: #f8fafc; color: var(--accent); }
        .nav-item.active { background: var(--accent); color: white; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2); }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .header { height: 90px; background: white; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }

        .content-body { flex: 1; padding: 40px; overflow-y: auto; background: var(--bg); }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .stat-card { background: white; padding: 30px; border-radius: 25px; border: 1px solid var(--border); box-shadow: var(--card-shadow); }
        .task-card { background: white; padding: 20px; border-radius: 18px; border: 1px solid var(--border); margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; }
        .task-card:hover { transform: translateX(5px); border-color: var(--accent); }

        /* SUBMENU */
        #sub-plano { padding-left: 20px; margin-top: -5px; margin-bottom: 10px; display: none; }
        .sub-link { padding: 10px 20px; font-size: 0.85rem; color: var(--text-sec); cursor: pointer; display: block; font-weight: 500; border-radius: 10px; }
        .sub-link:hover { color: var(--accent); background: #f1f5f9; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h2 style="margin-bottom: 10px; font-weight: 800;">OMNI v.120</h2>
            <input type="password" id="pass-input" placeholder="Chave de Acesso">
            <button class="btn" style="width:100%; margin-top:25px;" onclick="checkAccess()">ENTRAR</button>
        </div>
    </div>

    <aside class="sidebar">
        <div class="logo-box"><i class="fas fa-microchip"></i> OMNI NEXUS</div>
        <div class="nav-content">
            <div class="nav-item active" onclick="showTab('hoje', this)"><i class="fas fa-calendar-day"></i> <span>Missão de Hoje</span></div>
            <div class="nav-item" onclick="showTab('semanal', this)"><i class="fas fa-calendar-week"></i> <span>Cronograma Semanal</span></div>
            <div class="nav-item" onclick="toggleSub()"><i class="fas fa-sliders"></i> <span>Meu Plano</span> <i class="fas fa-chevron-down" style="margin-left:auto; font-size:0.7rem;"></i></div>
            <div id="sub-plano">
                <div class="sub-link" onclick="showTab('edital')">Importar Edital</div>
                <div class="sub-link" onclick="showTab('ciclo')">Ciclo Ativo</div>
                <div class="sub-link" onclick="showTab('config-h')">Horas Diárias</div>
            </div>
        </div>
    </aside>
    <main class="main-content">
        <header class="header">
            <h3 id="view-title">Missão de Hoje 🚓</h3>
            <div style="display: flex; gap: 15px;">
                <button class="btn btn-outline btn-sm" onclick="changeDay(-1)"><i class="fas fa-chevron-left"></i></button>
                <button class="btn btn-outline btn-sm" onclick="changeDay(1)"><i class="fas fa-chevron-right"></i></button>
            </div>
        </header>

        <div class="content-body">
            <div id="hoje" class="tab-content active">
                <div id="lista-diaria">
                    </div>
            </div>

            <div id="semanal" class="tab-content">
                <div class="stat-card">
                    <h3 style="margin-bottom:20px;">Projeção Semanal IA</h3>
                    <div id="cronograma-grade" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:15px;">
                        </div>
                </div>
            </div>

            <div id="edital" class="tab-content">
                <div class="stat-card">
                    <h3>Importar Edital Verticalizado</h3>
                    <p style="color:var(--text-sec); margin-top:10px;">Cole o conteúdo do seu edital para a IA organizar seu ciclo.</p>
                    <textarea id="edital-input" style="width:100%; height:200px; margin-top:20px;" placeholder="Direito Constitucional: Art. 5..."></textarea>
                    <button class="btn" style="margin-top:20px;">Processar com OMNI IA</button>
                </div>
            </div>

            <div id="ciclo" class="tab-content">
                <div class="stat-card">
                    <h3>Ciclo de Estudos Atual</h3>
                    <div id="ciclo-list" style="margin-top:20px;">
                        </div>
                </div>
            </div>

            <div id="config-h" class="tab-content">
                <div class="stat-card">
                    <h3>Configuração de Carga Horária</h3>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-top:20px;">
                        <div><label>Segunda-feira</label><input type="number" value="4" style="width:100%;"></div>
                        <div><label>Sábado</label><input type="number" value="2" style="width:100%;"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- BASE DE DADOS INTEGRADA ---
        let db = {
            h: { 0: 0, 1: 4, 2: 4, 3: 4, 4: 4, 5: 4, 6: 2 }, // Horas por dia (domingo a sábado)
            lista: [
                { m: "Direito Administrativo", h: { E: 1.5, Rev: 0.5, Ex: 0.5 }, done: { E: false, Rev: false, Ex: false } },
                { m: "Raciocínio Lógico", h: { E: 2, Rev: 0.5, Ex: 1 }, done: { E: false, Rev: false, Ex: false } },
                { m: "Língua Portuguesa", h: { E: 1.5, Rev: 0.5, Ex: 0.5 }, done: { E: false, Rev: false, Ex: false } },
                { m: "Direito Constitucional", h: { E: 1.5, Rev: 0.5, Ex: 0.5 }, done: { E: false, Rev: false, Ex: false } }
            ],
            metaFixa: {} // Banco de dados das missões diárias
        };

        let vDate = new Date();

        // --- FUNÇÕES DE NAVEGAÇÃO ---
        function showTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            if(el) el.classList.add('active');
            
            if(tabId === 'hoje') renderDiario(vDate);
        }

        function toggleSub() {
            const sub = document.getElementById('sub-plano');
            sub.style.display = sub.style.display === 'block' ? 'none' : 'block';
        }

        function changeDay(dir) {
            let novaData = new Date(vDate);
            novaData.setDate(vDate.getDate() + dir);
            
            let hoje = new Date();
            hoje.setHours(0,0,0,0);
            let diff = Math.round((novaData - hoje) / (1000 * 60 * 60 * 24));

            if (diff >= 0 && diff <= 1) {
                vDate = novaData;
                renderDiario(vDate);
            } else {
                alert("O plano OMNI NEXUS v.120 foca no HOJE e no AMANHÃ para manter sua disciplina.");
            }
        }
        // --- 1. CONTROLE DE ACESSO (O "123" DEFINITIVO) ---
        function checkAccess() {
            const senhaDigitada = document.getElementById('pass-input').value;
            if (senhaDigitada === "123") {
                document.getElementById('login-screen').style.display = 'none';
                init();
            } else {
                alert("Chave operacional incorreta! Tente novamente.");
            }
        }

        function init() {
            renderDiario(vDate);
            // Aqui você pode adicionar outras funções de inicialização (gráficos, etc)
        }

        // --- 2. RENDERIZAÇÃO DO PAINEL DIÁRIO (CIRURGIA SOLICITADA) ---
        function renderDiario(date) {
            const hjStr = new Date().toLocaleDateString();
            const curStr = date.toLocaleDateString();
            
            // Ajusta o título do cabeçalho
            document.getElementById('view-title').innerText = (hjStr === curStr) ? "Missão de Hoje 🚓" : "Missão de Amanhã 🗓️";

            // Se não houver missões geradas para esta data, o OMNI cria baseado na lista
            if (!db.metaFixa[curStr]) {
                db.metaFixa[curStr] = db.lista.map(item => ({
                    m: item.m,
                    k: "Estudo", // Tipo padrão
                    c: false     // Status: Não concluído
                }));
            }

            // --- CÁLCULO DE PROGRESSO DO CICLO ---
            let totalEtapasPossiveis = db.lista.length * 3; // E + Rev + Ex para cada matéria
            let etapasConcluidas = 0;
            
            db.lista.forEach(materia => {
                if(materia.done.E) etapasConcluidas++;
                if(materia.done.Rev) etapasConcluidas++;
                if(materia.done.Ex) etapasConcluidas++;
            });

            let percentualCiclo = totalEtapasPossiveis > 0 
                ? Math.round((etapasConcluidas / totalEtapasPossiveis) * 100) 
                : 0;

            // --- MONTAGEM DO HTML DO PAINEL ---
            let html = `
                <div class="stat-card" style="margin-bottom: 30px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <span style="font-weight:700; color:var(--text-sec); text-transform:uppercase; letter-spacing:1px; font-size:0.8rem;">Progresso do Ciclo Ativo</span>
                        <b style="color:var(--accent); font-size:1.5rem;">${percentualCiclo}%</b>
                    </div>
                    <div style="width:100%; height:12px; background:#e2e8f0; border-radius:10px; overflow:hidden;">
                        <div style="width:${percentualCiclo}%; height:100%; background:var(--accent); transition:0.6s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);"></div>
                    </div>
                </div>

                <h4 style="margin-bottom:20px; color:var(--text-sec); font-size:0.9rem; display:flex; align-items:center; gap:10px;">
                    <i class="fas fa-list-check"></i> LISTA DE TAREFAS OPERACIONAIS
                </h4>
                
                <div id="scroll-list" style="max-height: 500px; overflow-y: auto; padding-right: 10px;">
            `;

            // Gerar os cards das missões
            const missões = db.metaFixa[curStr];
            html += missões.map((tarefa, index) => {
                return `
                    <div class="task-card" style="border-left: 6px solid var(--accent);">
                        <div>
                            <div style="font-weight:800; font-size:1.05rem; color:var(--primary);">${tarefa.m}</div>
                            <div style="display:flex; gap:10px; margin-top:5px;">
                                <span style="background:rgba(37,99,235,0.1); color:var(--accent); padding:2px 8px; border-radius:5px; font-size:0.65rem; font-weight:800;">${tarefa.k}</span>
                                <span style="color:var(--text-sec); font-size:0.65rem; font-weight:600;"><i class="far fa-clock"></i> Carga Prevista</span>
                            </div>
                        </div>
                        <input type="checkbox" ${tarefa.c ? 'checked' : ''} 
                            onclick="marcarConclusão('${curStr}', ${index})">
                    </div>
                `;
            }).join('');

            // Injeta o HTML completo na div principal
            document.getElementById('lista-diaria').innerHTML = html + "</div>";
        }

        // Função para marcar tarefa como feita
        function marcarConclusão(dataStr, idx) {
            db.metaFixa[dataStr][idx].c = !db.metaFixa[dataStr][idx].c;
            // Opcional: Aqui você pode adicionar lógica para marcar no db.lista também
            renderDiario(vDate);
        }

    </script>
</body>
</html>
