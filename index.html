<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI COMMAND v.48 - PRF MATHEUS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a; --accent: #3b82f6; --bg: #f8fafc;
            --border: #e2e8f0; --text-main: #1e293b; --text-sec: #64748b;
            --color-e: #3b82f6; --color-res: #8b5cf6; --color-rev: #f59e0b; --color-ex: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 280px; background: var(--primary); display: flex; flex-direction: column; flex-shrink: 0; height: 100vh; overflow-y: auto; }
        .logo-box { padding: 30px; color: white; display: flex; align-items: center; gap: 10px; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .nav-item { padding: 15px 30px; color: #94a3b8; cursor: pointer; display: flex; align-items: center; gap: 15px; font-weight: 600; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: #1e293b; color: white; }
        
        .submenu { background: rgba(0,0,0,0.2); display: none; flex-direction: column; }
        .submenu.show { display: flex; }
        .sub-link { padding: 12px 30px 12px 70px; color: #64748b; font-size: 0.85rem; cursor: pointer; transition: 0.2s; font-weight: 500; }
        .sub-link:hover { color: white; }

        .main { flex: 1; height: 100vh; overflow-y: auto; padding: 45px; -webkit-overflow-scrolling: touch; }
        .container { max-width: 1000px; margin: 0 auto; }

        /* FLOW CARD */
        .flow-card { background: white; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 15px; padding: 20px; }
        .flow-grid { display: grid; grid-template-columns: 2fr repeat(4, 1fr); gap: 10px; margin-top: 15px; align-items: center; text-align: center; }
        .flow-grid input[type="number"] { width: 50px; padding: 4px; border: 1px solid var(--border); border-radius: 6px; text-align: center; }

        /* TASK CARD */
        .task-card { background: white; border-radius: 18px; padding: 25px; margin-bottom: 15px; border: 1px solid var(--border); border-left: 12px solid #ccc; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .task-card.done { opacity: 0.5; background: #f0fdf4; border-left-color: #10b981; }
        .tag { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; padding: 5px 10px; border-radius: 6px; color: white; }

        .btn { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 15px; }
        #login-screen { position: fixed; inset: 0; background: var(--primary); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 50px; border-radius: 35px; width: 420px; text-align: center; }
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h1>🚓</h1>
            <input type="password" id="pass-input" placeholder="Senha" style="width:100%; padding:14px; margin-top:20px; text-align:center; border:1px solid #ddd; border-radius:10px;">
            <button class="btn" onclick="checkAccess()">ENTRAR</button>
        </div>
    </div>

    <aside class="sidebar">
        <div class="logo-box">OMNI COMMAND</div>
        <div class="nav-item active" onclick="showTab('diaria', this)"><i class="fas fa-house"></i><span>Painel Diário</span></div>
        <div class="nav-item" onclick="toggleSub()"><i class="fas fa-folder-open"></i><span>Meu Plano</span><i class="fas fa-chevron-down" style="margin-left:auto; font-size:0.7rem;"></i></div>
        <div id="sub-plano" class="submenu">
            <div class="sub-link" onclick="showTab('edital')">Edital Verticalizado</div>
            <div class="sub-link" onclick="showTab('sinalizar')">Sinalizar Estudados</div>
            <div class="sub-link" onclick="showTab('fluxo')">Controle de Fluxo</div>
            <div class="sub-link" onclick="showTab('ciclo')">Ciclo Ativo</div>
            <div class="sub-link" onclick="showTab('config-h')">Configurar Horas/Dia</div>
        </div>
    </aside>

    <main class="main">
        <div class="container">
            <div id="diaria" class="page active">
                <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:30px;">
                    <div><h1>Meta de Hoje 🚓</h1><p id="meta-status" style="color:var(--text-sec); font-weight:600;"></p></div>
                    <button class="btn" style="width:auto; margin:0;" onclick="regenerateDaily()">🔄 Resetar Dia</button>
                </div>
                <div id="lista-diaria"></div>
            </div>

            <div id="fluxo" class="page"><h1>Controle de Fluxo</h1><div id="corpo-fluxo" style="margin-top:20px;"></div></div>

            <div id="config-h" class="page">
                <h1>Configurar Horas do Dia</h1>
                <div class="flow-card" style="margin-top:20px;">
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px;">
                        <div><label>Segunda a Sexta (h)</label><input type="number" id="q-util" onchange="applyQ('util', this.value)" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;"></div>
                        <div><label>Sábado e Domingo (h)</label><input type="number" id="q-fds" onchange="applyQ('fds', this.value)" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;"></div>
                    </div>
                    <div id="grid-horas-manual" style="display:grid; grid-template-columns:repeat(7,1fr); gap:10px; text-align:center;"></div>
                    <button class="btn" onclick="saveH()">SALVAR CARGA HORÁRIA</button>
                </div>
            </div>

            <div id="edital" class="page">
                <h1>Cadastrar Edital</h1>
                <div class="flow-card" style="padding:30px; margin-top:20px;">
                    <input type="text" id="add-mat" placeholder="Matéria" style="width:100%; padding:15px; margin-bottom:15px; border-radius:10px; border:1px solid var(--border);">
                    <textarea id="add-ass" placeholder="Assuntos (um por linha)" style="width:100%; height:120px; padding:15px; border-radius:10px; border:1px solid var(--border);"></textarea>
                    <button class="btn" onclick="saveEdital()">SALVAR NO BANCO</button>
                </div>
            </div>

            <div id="sinalizar" class="page"><h1>Sinalizar Bagagem</h1><div id="tree-container" style="margin-top:20px;"></div></div>
            <div id="ciclo" class="page"><h1>Ciclo Ativo</h1><div id="checks-ciclo" class="flow-card" style="columns:2;"></div><button class="btn" onclick="saveC()">ATUALIZAR CICLO</button></div>
        </div>
    </main>

<script>
    let db = JSON.parse(localStorage.getItem('prf_v48')) || { 
        lista: [], ciclo: [], h: {0:4,1:4,2:4,3:4,4:4,5:4,6:4}, pass: "123", metaFixa: {} 
    };

    function save() { localStorage.setItem('prf_v48', JSON.stringify(db)); }

    function checkAccess() {
        if(document.getElementById('pass-input').value === db.pass || document.getElementById('pass-input').value === "123") {
            document.getElementById('login-screen').style.display='none'; init();
        } else alert("Senha Incorreta!");
    }

    function init() { renderH(); renderDiario(); renderFluxo(); }
    function toggleSub() { document.getElementById('sub-plano').classList.toggle('show'); }

    function showTab(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(m => m.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(el && el.classList.contains('nav-item')) el.classList.add('active');
        if(id === 'fluxo') renderFluxo();
        if(id === 'diaria') renderDiario();
        if(id === 'sinalizar') renderTree();
        if(id === 'ciclo') renderCiclo();
    }

    // --- LOGICA DE CARREGAMENTO POR HORAS (O QUE VOCÊ PEDIU) ---
    function getPool() {
        let pool = [];
        db.ciclo.forEach(mName => {
            const assuntos = db.lista.filter(x => x.m === mName && !x.f);
            assuntos.forEach(ass => {
                const rito = [
                    {k:'E', l:'Estudo', c:'var(--color-e)'}, {k:'Res', l:'Resumo', c:'var(--color-res)'},
                    {k:'Rev', l:'Revisão', c:'var(--color-rev)'}, {k:'Ex', l:'Exercícios', c:'var(--color-ex)'}
                ];
                for(let s of rito) {
                    if(ass.act[s.k] && !ass.done[s.k]) {
                        pool.push({ m: ass.m, a: ass.a, label: s.l, color: s.c, key: s.k, hrs: parseFloat(ass.h[s.k]) });
                        return; // Pega apenas a próxima etapa pendente deste assunto
                    }
                }
            });
        });
        return pool;
    }

    function renderDiario() {
        const hj = new Date().toLocaleDateString();
        const diaSemana = new Date().getDay();
        const horasDisponiveis = parseFloat(db.h[diaSemana] || 4);
        
        if(!db.metaFixa[hj]) {
            const rawPool = getPool();
            let metaDia = [];
            let totalSoma = 0;
            let matsNoDia = new Set();

            for(let task of rawPool) {
                if(totalSoma + task.hrs <= horasDisponiveis) {
                    metaDia.push({...task, completed: false});
                    totalSoma += task.hrs;
                    matsNoDia.add(task.m);
                }
                if(totalSoma >= horasDisponiveis) break;
            }
            db.metaFixa[hj] = metaDia;
            save();
        }

        const meta = db.metaFixa[hj];
        const somaAtual = meta.reduce((acc, t) => acc + t.hrs, 0);
        document.getElementById('meta-status').innerText = `Carga Horária: ${somaAtual}h / ${horasDisponiveis}h`;

        document.getElementById('lista-diaria').innerHTML = meta.map((t, i) => `
            <div class="task-card ${t.completed?'done':''}" style="border-left-color:${t.color}">
                <div>
                    <span class="tag" style="background:${t.color}">${t.label} (${t.hrs}h)</span>
                    <div style="font-weight:800; font-size:1.2rem; margin-top:8px;">${t.m}: ${t.a}</div>
                </div>
                <input type="checkbox" style="width:30px; height:30px;" ${t.completed?'checked':''} onclick="concluir(${i}, '${t.m}', '${t.a}', '${t.key}')">
            </div>
        `).join('') || "<p>Nenhuma tarefa para as horas disponíveis. Verifique o Ciclo e o Fluxo.</p>";
    }

    function concluir(idx, m, a, k) {
        const hj = new Date().toLocaleDateString();
        const isDone = !db.metaFixa[hj][idx].completed;
        db.metaFixa[hj][idx].completed = isDone;
        
        const it = db.lista.find(x => x.m === m && x.a === a);
        it.done[k] = isDone;
        
        // Verifica se o assunto todo acabou
        const stepsAtivos = Object.keys(it.act).filter(key => it.act[key]);
        const tudoPronto = stepsAtivos.every(key => it.done[key]);
        if(tudoPronto) it.f = true;

        save();
        renderDiario();
    }

    function regenerateDaily() {
        const hj = new Date().toLocaleDateString();
        delete db.metaFixa[hj];
        save();
        renderDiario();
    }

    // --- CONTROLE DE FLUXO ---
    function renderFluxo() {
        document.getElementById('corpo-fluxo').innerHTML = db.lista.map((it, i) => `
            <div class="flow-card">
                <b>${it.m}: ${it.a}</b>
                <div class="flow-grid">
                    <small>Ativar/Horas:</small>
                    ${['E','Res','Rev','Ex'].map(k => `
                        <div>
                            <input type="checkbox" onchange="db.lista[${i}].act.${k}=this.checked;save()" ${it.act[k]?'checked':''}>
                            <input type="number" step="0.5" value="${it.h[k]}" onchange="db.lista[${i}].h.${k}=this.value;save()">
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    function renderH() {
        const d = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
        document.getElementById('grid-horas-manual').innerHTML = d.map((x,i) => `<div><small>${x}</small><input type="number" class="h-in" id="h-in-${i}" value="${db.h[i]}" style="text-align:center; width:100%; padding:5px;"></div>`).join('');
    }
    function applyQ(m, v) { (m === 'util' ? [1,2,3,4,5] : [0,6]).forEach(i => document.getElementById(`h-in-${i}`).value = v); }
    function saveH() { [0,1,2,3,4,5,6].forEach(i => db.h[i] = document.getElementById(`h-in-${i}`).value); save(); alert("Carga Horária Salva!"); renderDiario(); }

    function saveEdital() {
        const m = document.getElementById('add-mat').value;
        const ass = document.getElementById('add-ass').value.split('\n').filter(l => l.trim());
        ass.forEach(a => db.lista.push({ 
            m, a: a.trim(), f: false, 
            act: {E:true, Res:true, Rev:true, Ex:true}, 
            done: {E:false, Res:false, Rev:false, Ex:false},
            h: {E:1, Res:1, Rev:1, Ex:1} 
        }));
        document.getElementById('add-mat').value = ""; document.getElementById('add-ass').value = "";
        save(); alert("Edital Salvo!");
    }

    function renderTree() {
        const mats = [...new Set(db.lista.map(x => x.m))];
        document.getElementById('tree-container').innerHTML = mats.map(m => {
            const ass = db.lista.filter(x => x.m === m);
            return `<div class="flow-card"><b>${m}</b>${ass.map(a => `<div style="padding:10px; border-bottom:1px solid #eee; display:flex; justify-content:space-between;"><span>${a.a}</span><input type="checkbox" onchange="toggleV('${m}','${a.a}',this.checked)" ${a.done.E?'checked':''}></div>`).join('')}</div>`;
        }).join('');
    }
    function toggleV(m, a, v) { const it = db.lista.find(x => x.m === m && x.a === a); it.done.E = v; if(v) it.done.Res = v; save(); }
    function renderCiclo() {
        const m = [...new Set(db.lista.map(x => x.m))];
        document.getElementById('checks-ciclo').innerHTML = m.map(x => `<label style="display:block; padding:10px;"><input type="checkbox" class="ckc" value="${x}" ${db.ciclo.includes(x)?'checked':''}> ${x}</label>`).join('');
    }
    function saveC() { db.ciclo = Array.from(document.querySelectorAll('.ckc:checked')).map(c => c.value); save(); renderDiario(); alert("Ciclo salvo!"); }
</script>
</body>
</html>
